      meals = localGetMeals();
      weekDoc = localGetWeek();
      pantry = localGetPantry();
      history = localGetHistory();
      dataLoaded = true;
      render();
      return;
    }
    db = namespace;
    db.collection('meals').onSnapshot(function(qs){
      meals = qs.docs.map(function(d){ return normalizeMeal(Object.assign({id:d.id}, d.data())); });
      dataLoaded = true;
      render();
    }, function(err){ fallBackToLocal(err); });
    db.doc('week/current').onSnapshot(function(snap){
      weekDoc = snap.exists ? snap.data() : null;
      dataLoaded = true;
      render();
    }, function(err){ fallBackToLocal(err); });
    db.doc('pantry/current').onSnapshot(function(snap){
      var data = snap.exists ? snap.data() : null;
      pantry = normalizePantryList(data && data.items);
      render();
    }, function(){});
    db.collection('history').onSnapshot(function(qs){
      history = qs.docs.map(function(d){ return normalizeHistoryEntry(Object.assign({id:d.id}, d.data())); });
      render();
    }, function(){});
  }

  // The shared store died mid-session. `db` MUST be cleared here, not just
  // localMode set: leaving it set sent writes to the dead database while the
  // list rendered from localStorage, so every edit landed somewhere the app
  // never read back — saving appeared to do nothing at all.
  function fallBackToLocal(err){
    if (localMode && !db) return;
    db = null;
    localMode = true;
    meals = localGetMeals();
    weekDoc = localGetWeek();
    pantry = localGetPantry();
    history = localGetHistory();
    dataLoaded = true;
    ui.actionError = 'Lost the shared list' + (err && err.code ? ' ('+err.code+')' : '') +
      ' — still working on this device, but changes won’t sync until you reload.';
    render();
  }

  // ---------- rules engine ----------
  function computeWarnings(selected){
    var warnings = [], infos = [];
    var slots = weekSlots();
    if (selected.length < slots) warnings.push('Only '+selected.length+' of '+slots+' picked so far.');
    if (selected.length === slots && slots >= 3){
      var tierCounts = { often:0, sometimes:0, rarely:0, unranked:0 };
      selected.forEach(function(m){ tierCounts[m.tier||'unranked']++; });
      if ((tierCounts.rarely + tierCounts.unranked) === 0) warnings.push('Nothing from rarely or unranked this week — the list stops moving if it’s always the same meals.');
      if (tierCounts.often === 0) infos.push('No “often” meals this week — fine occasionally, worth noticing if it keeps happening.');
    }
    var longCooks = selected.filter(function(m){ return (parseFloat(m.effortMinutes)||0) >= 45; }).length;
    if (longCooks >= 4 && longCooks >= Math.ceil(slots * 0.6)) warnings.push('That’s '+longCooks+' long cooks this week — might be a lot on top of everything else.');
    var baseCounts = {};
    selected.forEach(function(m){ var b=(m.base||'').toLowerCase().trim(); if (!b) return; baseCounts[b]=(baseCounts[b]||0)+1; });
    var baseLimit = Math.max(3, Math.ceil(slots * 0.5));
    Object.keys(baseCounts).forEach(function(b){
      if (baseCounts[b] >= baseLimit) warnings.push(baseCounts[b]+' of these lean on '+b+' — want more variety?');
    });
    selected.forEach(function(m){
      var d = daysSince(m.lastCooked);
      if (m.tier === 'sometimes' && d < 24) warnings.push(escapeHtml(m.name)+' was cooked '+d+' day'+(d===1?'':'s')+' ago — sometimes meals are usually spaced about a month apart.');
      if (m.tier === 'rarely' && d < 75) warnings.push(escapeHtml(m.name)+' was cooked '+d+' day'+(d===1?'':'s')+' ago — rarely meals are usually spaced further apart than that.');
    });
    var itemCount = {};
    selected.forEach(function(m){ (m.ingredients||[]).forEach(function(i){ var k=(i.item||'').toLowerCase().trim(); if (!k) return; itemCount[k]=(itemCount[k]||0)+1; }); });
    var shared = Object.keys(itemCount).filter(function(k){ return itemCount[k] >= 2; }).length;
    if (shared > 0) infos.push(shared+' ingredient'+(shared===1?'':'s')+' shared across two or more of these picks — one purchase covers both.');
    return { warnings: warnings, infos: infos };
  }

  // Weighted-random auto-pick. Every meal starts at weight 1 (pure random) —
  // as soon as tiers get set, "often" and "sometimes" pull ahead proportionally
  // while "rarely"/"unranked" stay in the running, so the pick trends toward the
  // household's actual rankings without ever fully excluding anything. A meal
  // within its tier's cooldown window is heavily deprioritized (not excluded, so
  // a short list of meals still produces 5 picks) rather than enforced as a rule.
  var TIER_WEIGHT = { often: 4, sometimes: 2, rarely: 1, unranked: 1 };
  function weightForAutoPick(m){
    var w = TIER_WEIGHT[m.tier || 'unranked'] || 1;
    var d = daysSince(m.lastCooked);
    if (m.tier === 'sometimes' && d < 24) w *= 0.15;
    if (m.tier === 'rarely' && d < 75) w *= 0.1;
    return w;
  }
  function weightedPickWithoutReplacement(pool, n){
    var candidates = pool.slice();
    var chosen = [];
    for (var k=0; k<n && candidates.length>0; k++){
      var weights = candidates.map(weightForAutoPick);
      var total = weights.reduce(function(a,b){ return a+b; }, 0);
      if (total <= 0){ weights = candidates.map(function(){ return 1; }); total = candidates.length; }
      var r = Math.random() * total;
      var idx = 0;
      for (; idx < weights.length; idx++){ r -= weights[idx]; if (r <= 0) break; }
      if (idx >= candidates.length) idx = candidates.length - 1;
      chosen.push(candidates[idx]);
      candidates.splice(idx, 1);
    }
    return chosen;
  }

  // Plural forms shouldn't split a line ("garlic clove" / "garlic cloves"), so the
  // grouping key is singularised. Anything beyond that — "garlic" vs "garlic
  // cloves", "ginger" vs "fresh ginger" — needs the AI pass, which writes its
  // findings into weekDoc.itemAliases as variant -> canonical.
  function singulariseWord(w){
    if (w.length > 4 && /(ses|xes|zes|ches|shes)$/.test(w)) return w.slice(0,-2);
    if (w.length > 4 && /ies$/.test(w)) return w.slice(0,-3)+'y';
    if (w.length > 4 && /oes$/.test(w)) return w.slice(0,-2);
    if (w.length > 3 && /s$/.test(w) && !/(ss|us|is)$/.test(w)) return w.slice(0,-1);
    return w;
  }
  function aliasFor(name){
    var aliases = (weekDoc && weekDoc.itemAliases) || {};
    return aliases[normalizePantryTerm(name)] || null;
  }
  function canonicalItemKey(name){
    var base = aliasFor(name) || name;
    return normalizePantryTerm(base).split(' ').map(singulariseWord).join(' ');
  }

  function weekExtras(){
    var list = (weekDoc && Array.isArray(weekDoc.extraItems)) ? weekDoc.extraItems : [];
    return list.filter(function(x){ return x && x.item; }).map(function(x){
      return {
        item: String(x.item),
        quantity: x.quantity != null ? String(x.quantity) : '',
        unit: typeof x.unit === 'string' ? x.unit : '',
        section: SECTIONS.indexOf(x.section) !== -1 ? x.section : 'other'
      };
    });
  }

  function buildGroceryList(selected){
    var combined = {};
    selected.forEach(function(m){
      var scale = 4 / (parseFloat(m.servings) || 4);
      (m.ingredients||[]).forEach(function(ing){
        if (!ing.item) return;
        // Keyed on the ingredient alone, NOT ingredient+unit: merging duplicates
        // matters more than keeping units apart, so totals are tracked per unit
        // and rendered together ("3 cloves + 1 bulb") when a line mixes them.
        var key = canonicalItemKey(ing.item);
        if (!key) return;
        if (!combined[key]){
          combined[key] = {
            item: aliasFor(ing.item) || ing.item,
            variants: [], unitTotals: {}, rawParts: [], meals: [], breakdown: [],
            section: SECTIONS.indexOf(ing.section)>=0 ? ing.section : 'other',
            pantryStaple: true, flag: null, substitute: ''
          };
        }
        var c = combined[key];
        if (c.variants.indexOf(ing.item) === -1) c.variants.push(ing.item);
        if (c.meals.indexOf(m.name) === -1) c.meals.push(m.name);
        if (ing.flag && !c.flag){ c.flag = ing.flag; c.substitute = ing.substitute || ''; }
        if (!ing.pantryStaple) c.pantryStaple = false;
        if (c.section === 'other' && SECTIONS.indexOf(ing.section) >= 0) c.section = ing.section;

        var unit = String(ing.unit||'').trim();
        var qn = parseFloat(ing.quantity);
        var contributionNum = null, contributionRaw = null;
        if (ing.quantity !== '' && ing.quantity != null && !isNaN(qn)){
          contributionNum = qn * scale;
          c.unitTotals[unit] = (c.unitTotals[unit] || 0) + contributionNum;
        } else if (ing.quantity){
          contributionRaw = ing.quantity;
          c.rawParts.push(ing.quantity + (unit ? ' ' + unit : ''));
        }
        // Per-recipe breakdown so a merged line still shows which meal needs how much.
        var existing = c.breakdown.filter(function(b){ return b.meal === m.name && b.unit === unit; })[0];
        if (existing){
          if (contributionNum != null && existing.num != null) existing.num += contributionNum;
        } else {
          c.breakdown.push({ meal: m.name, num: contributionNum, raw: contributionRaw, unit: unit });
        }
      });
    });
    // Only on the full list — filtering to one meal is asking what THAT recipe
    // needs, and a one-off item belongs to no recipe.
    if (!ui.groceryMealFilter){
      weekExtras().forEach(function(x){
        var key = canonicalItemKey(x.item);
        if (!key) return;
        if (!combined[key]){
          combined[key] = {
            item: x.item, variants: [x.item], unitTotals: {}, rawParts: [], meals: [], breakdown: [],
            section: x.section, pantryStaple: false, flag: autoFlagIngredient(x.item) ? autoFlagIngredient(x.item).flag : null,
            substitute: '', extra: true
          };
        }
        var c = combined[key];
        c.extra = true;
        var unit = String(x.unit || '').trim();
        var qn = parseFloat(x.quantity);
        if (x.quantity !== '' && !isNaN(qn)) c.unitTotals[unit] = (c.unitTotals[unit] || 0) + qn;
        else if (x.quantity) c.rawParts.push(x.quantity + (unit ? ' ' + unit : ''));
        c.breakdown.push({ meal: 'Added by hand', num: (isNaN(qn) ? null : qn), raw: (isNaN(qn) ? x.quantity : null), unit: unit });
      });
    }
    var bySection = {}; SECTIONS.forEach(function(s){ bySection[s] = []; });
    Object.keys(combined).forEach(function(k){
      var item = combined[k];
      // Anything the household has told us it already owns is a cupboard check,
      // never a buy line — whatever the recipe's own pantryStaple flag says.
      var match = pantryMatchFor(item.item) ||
        item.variants.map(pantryMatchFor).filter(Boolean)[0] || null;
      if (match){ item.inPantry = true; item.pantryMatch = match; item.pantryStaple = true; }
      item.mergedFrom = item.variants.filter(function(v){
        return normalizePantryTerm(v) !== normalizePantryTerm(item.item);
      });
      item.waste = isLikelyWaste(item);
      bySection[item.section].push(item);
    });
    SECTIONS.forEach(function(s){ bySection[s].sort(function(a,b){ return a.item.localeCompare(b.item); }); });
    return bySection;
  }

  // Totals per unit, joined — "5 cloves", or "3 cloves + 1 bulb" when a merged
  // line genuinely mixes measures rather than pretending they add up.
  function formatQty(item){
    var parts = Object.keys(item.unitTotals || {}).filter(function(u){ return item.unitTotals[u]; })
      .map(function(u){
        var n = Math.round(item.unitTotals[u]*100)/100;
        return n + (u ? ' '+u : '');
      });
    (item.rawParts || []).forEach(function(r){ parts.push(r); });
    if (!parts.length) return 'amount varies — check the recipe';
    return parts.join(' + ');
  }

  // "Small amount for one meal" is only worth saying when you're forced to buy a
  // whole pack for a spoonful — a bunch of coriander for one tbsp. Used to fire on
  // anything a single meal needed, which was almost every line and therefore noise:
  // two tins of butter beans is not a waste risk.
  var PARTIAL_PACK_UNITS = { tsp:1, tbsp:1, sprig:1, sprigs:1, clove:1, cloves:1, pinch:1, pinches:1, handful:1, handfuls:1, stick:1, sticks:1, leaf:1, leaves:1 };
  function isLikelyWaste(item){
    if (item.meals.length !== 1 || item.pantryStaple) return false;
    var units = Object.keys(item.unitTotals || {});
    for (var i=0;i<units.length;i++){
      var unit = units[i].toLowerCase().trim();
      var qty = item.unitTotals[units[i]];
      if (PARTIAL_PACK_UNITS[unit]) return true;
      if ((unit === 'g' || unit === 'ml') && qty > 0 && qty <= 60) return true;
    }
    return false;
  }

  function formatBreakdownEntry(b){
    if (b.num != null){
      var n = Math.round(b.num*100)/100;
      return n + (b.unit ? ' '+b.unit : '');
    }
    if (b.raw) return b.raw + (b.unit ? ' '+b.unit : '');
    return b.unit || 'amount varies';
  }

  // ---------- clipboard ----------
  async function copyText(text, label){
    var ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch(e){ ok = false; }
    if (!ok){
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        ok = document.execCommand('copy');
        document.body.removeChild(ta);
      } catch(e){ ok = false; }
    }
    if (ok){
      ui.toast = (label||'List')+' copied';
      ui.copyFallbackText = null;
      render();
      setTimeout(function(){ ui.toast = null; render(); }, 2200);
    } else {
      ui.copyFallbackText = text;
      render();
    }
  }
  // Ticked items are left out: this text goes straight into a reminders list, and
  // pasting things you've already picked up is worse than useless.
  function groceryCopyText(bySection, onlyBuy, checked){
    checked = checked || {};
    var lines = [];
    SECTIONS.forEach(function(s){
      var items = bySection[s].filter(function(i){
        if (onlyBuy ? i.pantryStaple : !i.pantryStaple) return false;
        return !isGroceryChecked(checked, groceryKey(s, i.item));
      });
      if (!items.length) return;
      lines.push('-- '+SECTION_LABELS[s]+' --');
      items.forEach(function(item){
        var detail = item.meals.length > 1
          ? item.breakdown.map(function(b){ return formatBreakdownEntry(b)+' for '+b.meal; }).join(', ')
          : item.meals.join(', ');
        var line = item.item+' — '+formatQty(item)+' ('+detail+')';
        if (item.inPantry) line += ' [in pantry]';
        if (item.flag) line += ' [' + flagLabel(item.flag) + (item.substitute? ': '+item.substitute:'') + ']';
        else if (item.substitute) line += ' [note: ' + item.substitute + ']';
        lines.push(line);
      });
    });
    return lines.join('\n');
  }

  // ---------- PDF + AI extraction ----------
  async function extractPdfText(file){
    if (typeof pdfjsLib === 'undefined') throw new Error('pdf-lib-unavailable');
    if (!pdfjsLib.GlobalWorkerOptions.workerSrc){
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    }
    var buf = await file.arrayBuffer();
    var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    var text = '';
    for (var i=1;i<=pdf.numPages;i++){
      var page = await pdf.getPage(i);
      var content = await page.getTextContent();
      text += content.items.map(function(it){ return it.str || ''; }).join(' ') + '\n';
    }
    return text.trim();
  }

  var FLAG_ENUM_STR = Object.keys(FLAG_LABELS).map(function(k){ return '"'+k+'"'; }).join('|');
  var HOUSEHOLD_RULES_TEXT = 'Household dietary restrictions to flag against: strictly gluten-free (flag common gluten '
    + 'culprits like soy sauce, stock, oats, pasta, gnocchi, tortillas, breadcrumbs, spice blends), plus these specific '
    + 'allergens whenever they appear: egg white (treat whole eggs, mayonnaise, and meringue as this too — the white is '
    + 'always present), flaxseed or linseed, cashew, pistachio, hazelnut, mushroom, gliadin, orange, cuttlefish, '
    + 'brewer’s yeast, lobster, and cow’s milk (including cheese, yogurt, butter, and cream). This household is not '
    + 'vegan — meat, fish and non-cow dairy are fine unless they trip one of the allergens above. Flag each affected '
    + 'ingredient with the specific restriction it breaks and a substitute only where there is a genuinely safe, '
    + 'well-established one — say there is no confident substitute rather than guessing for something like a shellfish '
    + 'allergy.';

  function buildExtractionPrompt(text, sourceUrl){
    var schema = '{\n'
      + ' "name": string,\n'
      + ' "base": string (main protein or base, e.g. "chicken thighs", "butter beans"),\n'
      + ' "effort": string (short human description, e.g. "Low, 30 min, one pan"),\n'
      + ' "effortMinutes": number (best-guess total active+cook minutes),\n'
      + ' "servings": number (as written, or 4 if unclear),\n'
      + ' "method": string (numbered steps, one per line, in plain everyday language),\n'
      + ' "macros": {"calories": number, "protein": number, "carbs": number, "fat": number} — PER SERVING, your best estimate from the ingredients; omit a value you cannot reasonably estimate,\n'
      + ' "dietFlags": [{"rule": string, "substitute": string}] for any of the household rules this dish breaks as written,\n'
      + ' "ingredients": [{"item": string, "quantity": string, "unit": string, "section": "produce"|"protein"|"dairy-and-chilled"|"tins-and-dry-goods"|"freezer"|"other", "pantryStaple": boolean, "flag": ' + FLAG_ENUM_STR + '|null, "substitute": string}]\n'
      + '}';
    return 'You are filling in a structured recipe record for a household meal-planning app.\n\n'
      + HOUSEHOLD_RULES_TEXT + '\n\n'
      + 'Reply with ONLY a JSON object with exactly this shape, no other text:\n' + schema + '\n\n'
      + 'Recipe text:\n"""\n' + text.slice(0,6000) + '\n"""'
      + (sourceUrl ? ('\n\nOriginal source (context only, do not fetch it): ' + sourceUrl) : '');
  }

  function mapDietFlags(list){
    return Array.isArray(list) ? list.map(function(f){ return { rule: f.rule||'', substitute: f.substitute||'' }; }) : [];
  }
  function mapIngredients(list){
    return Array.isArray(list) ? list.map(function(i){
      var flag = migrateFlag(i.flag), sub = i.substitute || '';
      if (!flag){ var auto = autoFlagIngredient(i.item); if (auto){ flag = auto.flag; sub = sub || auto.substitute; } }
      return { item: i.item||'', quantity: String(i.quantity!=null?i.quantity:''), unit: i.unit||'', section: SECTIONS.indexOf(i.section)!==-1 ? i.section : 'other', pantryStaple: !!i.pantryStaple, flag: flag||null, substitute: sub };
    }) : [];
  }
  // Clears the transient state that belongs to one visit to the meal form, so a
  // stale error or a stuck "Saving…" never carries over into the next meal.
  // Best-effort dish name from a recipe URL's own slug — the one piece of the
  // page we can actually read, since the sandbox won't let us fetch it.
  function deriveNameFromUrl(url){
    var raw = String(url || '').trim();
    if (!raw) return '';
    var path = raw.replace(/^[a-z]+:\/\//i, '').replace(/[?#].*$/, '');
    var parts = path.split('/');
    parts.shift(); // the host is never the dish name
    parts = parts.filter(function(p){ return p && !/\.[a-z]{2,5}$/i.test(p); });
    if (!parts.length) return '';
    var slug = parts[parts.length-1];
    // A trailing numeric id isn't the dish; fall back to the segment before it.
    if (/^\d+$/.test(slug) && parts.length > 1) slug = parts[parts.length-2];
    if (!slug) return '';
    var words = slug.replace(/[-_+]+/g, ' ').replace(/\s+/g, ' ').trim()
      .replace(/^\d+\s+/, '').replace(/\s+\d{4,}$/, '');
    if (!words) return '';
    return words.split(' ').map(function(w){
      return w.length > 2 ? w.charAt(0).toUpperCase() + w.slice(1) : w;
    }).join(' ');
  }

  function resetAdjustState(){
    ui.adjustInstruction = ''; ui.adjusting = false; ui.adjustError = null; ui.adjustApplied = false;
    ui.formError = null; ui.formSaving = false;
  }
  function draftToMeal(draft, sourceUrl){
    var m = blankMeal();
    m.name = draft.name || ''; m.base = draft.base || ''; m.effort = draft.effort || '';
    m.effortMinutes = draft.effortMinutes || ''; m.servings = draft.servings || 4;
    m.method = draft.method || '';
    m.sourceUrl = sourceUrl || '';
    m.dietFlags = mapDietFlags(draft.dietFlags);
    m.ingredients = mapIngredients(draft.ingredients);
    m.macros = normalizeMacros(draft.macros);
    m.macrosSource = draft.macrosSource || (hasMacros({macros:m.macros}) ? 'estimate' : '');
    return m;
  }

  // Drafting from a link we cannot open. The prompt has to be explicit that this
  // is reconstruction from a name, not retrieval — and the result is labelled as
  // such in the saved record, because guessing at ingredients for a household
  // with a real allergy list is only safe if everyone knows it's a guess.
  function buildLinkDraftPrompt(name, url){
    return 'A household meal-planning app saved a recipe link but CANNOT open the page. '
      + 'Write a plausible starting-point version of this dish from the name alone, so the household has something to edit.\n\n'
      + 'Dish name (taken from the link): ' + name + '\n'
      + 'Link (for context only — you cannot read it, do not pretend to): ' + url + '\n\n'
      + HOUSEHOLD_RULES_TEXT + '\n\n'
      + 'Reply with ONLY a JSON object of this shape, no other text:\n'
      + '{ "name": string, "base": string, "effort": string, "effortMinutes": number, "servings": number, '
      + '"method": string (numbered steps, one per line), "notes": string (say plainly this is reconstructed from the name, not the linked page), '
      + '"dietFlags": [{"rule": string, "substitute": string}], '
      + '"ingredients": [{"item": string, "quantity": string, "unit": string, '
      + '"section": "produce"|"protein"|"dairy-and-chilled"|"tins-and-dry-goods"|"freezer"|"other", '
      + '"pantryStaple": boolean, "flag": ' + FLAG_ENUM_STR + '|null, "substitute": string} ] }';
  }

  // Literal matching only catches the same words. This asks Claude which shopping
  // items the household's staples actually cover — "chopped tomatoes" against
  // "tinned tomatoes", "vegetable bouillon" against "stock" — while being clear
  // that a near-miss is worse than a miss: telling someone they already have
  // something they don't means the meal can't be cooked.
  // Sorting what someone typed into the pantry. The job is tidying wording and
  // picking a shelf — NOT inventing items, which is the failure that would
  // quietly put things in the cupboard that were never bought.
  function buildPantrySortPrompt(rawText, existingNames){
    return 'Someone is adding things to a household pantry list. Turn what they typed into clean entries.\n\n'
      + 'What they typed:\n"""\n' + String(rawText).slice(0, 2000) + '\n"""\n\n'
      + 'Already on the list (do not repeat these):\n'
      + (existingNames.length ? existingNames.map(function(n){ return '- ' + n; }).join('\n') : '- (nothing yet)') + '\n\n'
      + 'Rules:\n'
      + '- One entry per distinct thing. Split on commas, "and", and line breaks.\n'
      + '- Use the plainest shopping name: "tinned tomatoes", not "1 tin of chopped toms".\n'
      + '- Drop quantities and packaging — this is a list of what is in the house, not how much.\n'
      + '- NEVER add anything they did not mention. No assumed staples, no "you probably also have".\n'
      + '- Skip anything already on the list above.\n'
      + '- Put each on one shelf: "produce", "protein", "dairy-and-chilled", "tins-and-dry-goods", "freezer", or "other".\n'
      + '- If they said something is running low or nearly out, set low to true.\n\n'
      + 'Reply with ONLY this JSON:\n'
      + '{ "items": [ { "name": string, "section": string, "low": boolean } ] }';
  }

  function buildPantryMatchPrompt(pantryList, itemNames){
    var noMatchRule = 'Do NOT treat different ingredients as the same just because they sound alike or '
      + 'belong to the same family: butter is not butter beans, plain flour is not cornflour, white wine '
      + 'vinegar is not white wine, milk is not coconut milk, spring onion is not onion, lime is not lemon. '
      + 'When unsure, leave it alone — a wrong call means they skip buying something they actually need '
      + 'and can’t cook the meal.';
    return 'Tidy up a household’s weekly shopping list. Two separate jobs.\n\n'
      + 'JOB 1 — MERGE DUPLICATES. The list is built from several recipes that word things differently, so '
      + 'the same ingredient can appear more than once ("garlic" and "garlic cloves"; "ginger" and "fresh '
      + 'ginger"; "spring onions" and "scallions"). Group every set of entries that are the same thing to '
      + 'buy, and give each group the shortest, plainest shopping name — "garlic", not "garlic cloves". '
      + 'Only group entries that appear in the list below. Ignore differences of form or preparation that '
      + 'don’t change what you buy (fresh/chopped/minced/whole/large). ' + noMatchRule + '\n\n'
      + 'JOB 2 — PANTRY. Say which list entries are already covered by the household’s staples, allowing '
      + 'for different wording, brand, form or packaging ("chopped tomatoes" covered by "tinned tomatoes"; '
      + '"vegetable bouillon" by "stock"; "extra virgin olive oil" by "olive oil"). ' + noMatchRule + '\n\n'
      + 'Pantry staples:\n' + (pantryList.length ? pantryList.map(function(p){ return '- ' + p; }).join('\n') : '- (none)') + '\n\n'
      + 'Shopping list entries:\n' + itemNames.map(function(i){ return '- ' + i; }).join('\n') + '\n\n'
      + 'Reply with ONLY this JSON. Include a duplicate group only when it has two or more entries, and a '
      + 'pantry match only when you are confident:\n'
      + '{ "duplicates": [ { "name": "<plain shopping name>", "entries": ["<exact entry>", "<exact entry>"] } ], '
      + '"matches": [ { "item": "<exact entry>", "pantry": "<the staple that covers it>" } ] }';
  }

  // Estimating macros for a meal that has none. Deliberately asks for a
  // per-serving figure and nothing else: the batch and weekly numbers are
  // derived from it, so a model that answered "for the whole tray" would throw
  // every total in the app out by a factor of the serving count.
  function buildMacroPrompt(m){
    var recipe = {
      name: m.name, base: m.base, servings: parseFloat(m.servings) || 4,
      ingredients: (m.ingredients || []).map(function(i){
        return { item: i.item, quantity: i.quantity, unit: i.unit };
      }),
      method: m.method
    };
    return 'Estimate the nutrition for one serving of this home-cooked recipe.\n\n'
      + 'The recipe makes ' + recipe.servings + ' servings. Work out the totals for the whole batch from the '
      + 'ingredient quantities, then DIVIDE BY ' + recipe.servings + ' and report the per-serving figures only.\n\n'
      + 'Use ordinary reference values for the ingredients. Where a quantity is vague ("a drizzle", "to taste"), '
      + 'assume a normal domestic amount. Round to whole numbers.\n\n'
      + 'Recipe (JSON):\n' + JSON.stringify(recipe, null, 2) + '\n\n'
      + 'Reply with ONLY this JSON, and omit any value you genuinely cannot estimate:\n'
      + '{ "calories": number, "protein": number, "carbs": number, "fat": number }';
  }

  function mealsMissingMacros(){
    return meals.filter(function(m){ return !hasMacros(m) && (m.ingredients || []).length > 0; });
  }

  // Returns true if it actually wrote something. Rejections are left to the
  // caller so a single failure and a batch failure can be reported differently.
  async function estimateMacrosFor(m){
    var result = await sampleFn.json(buildMacroPrompt(m), 'macros');
    var next = normalizeMacros(result);
    if (!hasMacros({ macros: next })) return false;
    var updated = Object.assign({}, m, { macros: next, macrosSource: 'estimate' });
    await saveMeal(updated);
    return true;
  }

  function buildAdjustPrompt(draft, instruction){
    var current = {
      name: draft.name, base: draft.base, servings: draft.servings,
      method: draft.method, notes: draft.notes,
      dietFlags: draft.dietFlags, ingredients: draft.ingredients
    };
    var schema = '{ "base": string, '
      + '"method": string (the COMPLETE rewritten method, numbered steps one per line, already reflecting the change), '
      + '"notes": string, '
      + '"macros": {"calories": number, "protein": number, "carbs": number, "fat": number} (PER SERVING, re-estimated for the adjusted recipe), '
      + '"dietFlags": [{"rule": string, "substitute": string}], '
      + '"ingredients": [{"item": string, "quantity": string, "unit": string, '
      + '"section": "produce"|"protein"|"dairy-and-chilled"|"tins-and-dry-goods"|"freezer"|"other", '
      + '"pantryStaple": boolean, "flag": ' + FLAG_ENUM_STR + '|null, "substitute": string} ] }';
    return 'You are adjusting an existing recipe record for a household meal-planning app, based on a requested change.\n\n'
      + 'Re-estimate the per-serving macros for the adjusted recipe — swapping butter for oil, or doubling a batch, '
      + 'changes them.\n\n'
      + 'CRITICAL: apply the change EVERYWHERE it appears, not just in the ingredient list. Rewrite the method text so '
      + 'every step matches the adjusted ingredients — if butter becomes oil, no step may still say "melt the butter"; it '
      + 'should say "heat the oil", and any technique that only made sense for the old ingredient should change with it '
      + '(quantities, timings and wording included). Re-read your own method before answering and confirm the replaced '
      + 'ingredient appears nowhere in it. The same goes for scaling: change the numbers in the steps, not only the list.\n\n'
      + HOUSEHOLD_RULES_TEXT + ' Respect these unless the requested change itself deliberately overrides one.\n\n'
      + 'Current recipe (JSON):\n' + JSON.stringify(current, null, 2) + '\n\n'
      + 'Requested change: ' + instruction + '\n\n'
      + 'Reply with ONLY a JSON object with exactly this shape, reflecting the FULL recipe after applying the change '
      + '(carry over any field the change does not affect unchanged, do not omit or shorten it):\n' + schema;
  }

  // ---------- the assistant ----------
  //
  // It proposes; it never writes. Everything it suggests comes back as a list
  // of typed actions which are validated against real records here, shown as a
  // plain-English change, and applied only when the household presses Apply.
  // That ordering is the whole design: a model that can silently rewrite a
  // method is a model that can silently rewrite an allergy note.

  var ASSISTANT_MAX_TURNS = 8;

  // What the model gets to see. Full methods only for the meals it plausibly
  // needs — the week's picks and anything named in the message — because
  // sending every method of forty meals is both slow and mostly noise.
  function assistantContext(userText){
    var lower = String(userText || '').toLowerCase();
    var weekIds = getWeekIds().filter(Boolean);
    var lines = [];

    lines.push('MEALS (use the exact id when you act on one):');
    meals.forEach(function(m){
      var mentioned = m.name && lower.indexOf(m.name.toLowerCase()) !== -1;
      var inWeek = weekIds.indexOf(m.id) !== -1;
      var ings = (m.ingredients || []).map(function(i){
        return [i.quantity, i.unit, i.item].filter(Boolean).join(' ');
      }).filter(Boolean);
      lines.push('- id=' + m.id + ' | ' + m.name +
        ' | base: ' + (m.base || 'n/a') +
        ' | serves ' + (parseFloat(m.servings) || 4) +
        ' | rank: ' + (m.tier || 'unranked') +
        (inWeek ? ' | IN THIS WEEK' : ''));
      lines.push('    ingredients: ' + (ings.length ? ings.join('; ') : '(none listed)'));
      if (mentioned || inWeek){
        lines.push('    method: ' + (m.method ? m.method.replace(/\n/g, ' \\n ') : '(none written)'));
        if (m.notes) lines.push('    notes: ' + m.notes);
      }
    });
    if (!meals.length) lines.push('- (no meals saved yet)');

    lines.push('');
    lines.push('THIS WEEK is planning for ' + weekSlots() + ' dinner' + (weekSlots()===1?'':'s') + '.');
    lines.push('PICKED SO FAR: ' + (weekIds.length
      ? weekIds.map(function(id){
          var m = meals.filter(function(x){ return x.id === id; })[0];
          return m ? m.name : id;
        }).join(', ')
      : '(nothing picked)'));

    lines.push('');
    lines.push('PANTRY: ' + (pantry.length
      ? pantry.map(function(p){ return p.name + (p.low ? ' (low)' : ''); }).join(', ')
      : '(empty)'));

    var extras = weekExtras();
    lines.push('EXTRA BUY-LIST ITEMS: ' + (extras.length
      ? extras.map(function(x){ return [x.quantity, x.unit, x.item].filter(Boolean).join(' '); }).join(', ')
      : '(none)'));

    return lines.join('\n');
  }

  var ASSISTANT_ACTION_SCHEMA =
    '  {"type":"updateMeal","mealId":"<id>","changes":{"name"?:string,"base"?:string,"servings"?:number,' +
    '"tier"?:"often"|"sometimes"|"rarely"|"unranked","method"?:string,"notes"?:string}}\n' +
    '  {"type":"addIngredient","mealId":"<id>","item":string,"quantity"?:string,"unit"?:string,' +
    '"section"?:"produce"|"protein"|"dairy-and-chilled"|"tins-and-dry-goods"|"freezer"|"other"}\n' +
    '  {"type":"removeIngredient","mealId":"<id>","item":"<exact existing item>"}\n' +
    '  {"type":"updateIngredient","mealId":"<id>","item":"<exact existing item>","newItem"?:string,' +
    '"quantity"?:string,"unit"?:string}\n' +
    '  {"type":"addMeal","name":string,"base"?:string,"servings"?:number,"method"?:string,' +
    '"ingredients"?:[{"item":string,"quantity"?:string,"unit"?:string}]}\n' +
    '  {"type":"setWeekSlots","slots":number}   // how many dinners the week plans for, 1 to 10\n' +
    '  {"type":"addToWeek","mealId":"<id>"}\n' +
    '  {"type":"removeFromWeek","mealId":"<id>"}\n' +
    '  {"type":"addBuyItem","item":string,"quantity"?:string,"unit"?:string,"section"?:string}\n' +
    '  {"type":"removeBuyItem","item":string}\n' +
    '  {"type":"addPantry","name":string,"section"?:string,"low"?:boolean}\n' +
    '  {"type":"removePantry","name":string}\n' +
    '  {"type":"setPantryLow","name":string,"low":boolean}';

  function buildAssistantPrompt(history, userText){
    var convo = history.slice(-ASSISTANT_MAX_TURNS).map(function(m){
      return (m.role === 'user' ? 'THEM: ' : 'YOU: ') + m.text;
    }).join('\n');

    return 'You are the assistant inside a two-person household meal-planning app. You help them change '
      + 'what is in it, by proposing edits the app will apply only after they press Apply.\n\n'
      + HOUSEHOLD_RULES_TEXT + '\n\n'
      + 'HOW TO BEHAVE:\n'
      + '- If you are not certain WHICH meal, ingredient or item they mean, do NOT guess. Return a question '
      + 'and no actions. Guessing wrong here rewrites a recipe they rely on.\n'
      + '- Rewriting a method means returning the COMPLETE new method, numbered steps one per line, not a '
      + 'fragment or a description of the change.\n'
      + '- When you change an ingredient, change the method to match if the method mentions it. A recipe '
      + 'whose steps contradict its ingredients is worse than one you left alone.\n'
      + '- Only ever reference a meal by an id from the list below. Never invent an id.\n'
      + '- Do only what was asked. Do not tidy, improve or add things nobody mentioned.\n'
      + '- If something they ask for would break a household rule, say so in the reply and propose the safe '
      + 'version instead.\n'
      + '- If they are just asking a question, answer it in the reply with no actions at all.\n\n'
      + 'CURRENT STATE:\n' + assistantContext(userText) + '\n\n'
      + (convo ? 'CONVERSATION SO FAR:\n' + convo + '\n\n' : '')
      + 'THEIR MESSAGE: ' + userText + '\n\n'
      + 'Reply with ONLY this JSON:\n'
      + '{\n'
      + '  "reply": "<a sentence or two to them, plain language>",\n'
      + '  "question": "<ask only if you genuinely cannot tell what they mean, else omit>",\n'
      + '  "options": ["<short tappable answers to your question, if useful>"],\n'
      + '  "actions": [\n' + ASSISTANT_ACTION_SCHEMA + '\n  ]\n'
      + '}\n'
      + 'Return "actions": [] when there is nothing to change.';
  }

  // Everything the model proposes is checked against real records before it is
  // ever shown, let alone applied. An action naming a meal that doesn't exist
  // is dropped, not guessed at.
  function findMealById(id){ return meals.filter(function(m){ return m.id === id; })[0] || null; }
  function findIngredient(meal, name){
    var n = normalizePantryTerm(name);
    var list = meal.ingredients || [];
    for (var i = 0; i < list.length; i++){
      if (normalizePantryTerm(list[i].item) === n) return i;
    }
    for (var j = 0; j < list.length; j++){
      if (normalizePantryTerm(list[j].item).indexOf(n) !== -1 && n) return j;
    }
    return -1;
  }

  function validateAction(a){
    if (!a || typeof a !== 'object' || typeof a.type !== 'string') return null;
    var meal = a.mealId ? findMealById(a.mealId) : null;

    switch (a.type){
      case 'updateMeal': {
        if (!meal || !a.changes || typeof a.changes !== 'object') return null;
        var ch = {};
        ['name','base','method','notes'].forEach(function(k){
          if (typeof a.changes[k] === 'string' && a.changes[k].trim()) ch[k] = a.changes[k];
        });
        if (a.changes.servings != null && !isNaN(parseFloat(a.changes.servings))) ch.servings = parseFloat(a.changes.servings);
        if (TIERS.indexOf(a.changes.tier) !== -1) ch.tier = a.changes.tier;
        if (!Object.keys(ch).length) return null;
        return { type:'updateMeal', mealId: meal.id, meal: meal, changes: ch };
      }
      case 'addIngredient': {
        if (!meal || typeof a.item !== 'string' || !a.item.trim()) return null;
        return { type:'addIngredient', mealId: meal.id, meal: meal,
          item: a.item.trim(),
          quantity: a.quantity != null ? String(a.quantity) : '',
          unit: typeof a.unit === 'string' ? a.unit : '',
          section: SECTIONS.indexOf(a.section) !== -1 ? a.section : 'other' };
      }
      case 'removeIngredient': {
        if (!meal || typeof a.item !== 'string') return null;
        var ri = findIngredient(meal, a.item);
        if (ri === -1) return null;
        return { type:'removeIngredient', mealId: meal.id, meal: meal, index: ri, item: meal.ingredients[ri].item };
      }
      case 'updateIngredient': {
        if (!meal || typeof a.item !== 'string') return null;
        var ui2 = findIngredient(meal, a.item);
        if (ui2 === -1) return null;
        var patch = {};
        if (typeof a.newItem === 'string' && a.newItem.trim()) patch.item = a.newItem.trim();
        if (a.quantity != null) patch.quantity = String(a.quantity);
        if (typeof a.unit === 'string') patch.unit = a.unit;
        if (!Object.keys(patch).length) return null;
        return { type:'updateIngredient', mealId: meal.id, meal: meal, index: ui2,
          item: meal.ingredients[ui2].item, patch: patch };
      }
      case 'addMeal': {
        if (typeof a.name !== 'string' || !a.name.trim()) return null;
        return { type:'addMeal', name: a.name.trim(), base: a.base || '',
          servings: parseFloat(a.servings) || 4,
          method: typeof a.method === 'string' ? a.method : '',
          ingredients: Array.isArray(a.ingredients) ? a.ingredients : [] };
      }
      case 'setWeekSlots': {
        var want = parseInt(a.slots, 10);
        if (isNaN(want) || want < MIN_SLOTS || want > MAX_SLOTS || want === weekSlots()) return null;
        var losing = getWeekIds().slice(want).filter(Boolean).map(function(mid){
          var mm = findMealById(mid);
          return mm ? mm.name : 'a meal';
        });
        return { type:'setWeekSlots', slots: want, from: weekSlots(), losing: losing };
      }
      case 'addToWeek': {
        if (!meal) return null;
        if (getWeekIds().indexOf(meal.id) !== -1) return null;
        if (getWeekIds().indexOf(null) === -1) return null;
        return { type:'addToWeek', mealId: meal.id, meal: meal };
      }
      case 'removeFromWeek': {
        if (!meal || getWeekIds().indexOf(meal.id) === -1) return null;
        return { type:'removeFromWeek', mealId: meal.id, meal: meal };
      }
      case 'addBuyItem': {
        if (typeof a.item !== 'string' || !a.item.trim()) return null;
        return { type:'addBuyItem', item: a.item.trim(),
          quantity: a.quantity != null ? String(a.quantity) : '',
          unit: typeof a.unit === 'string' ? a.unit : '',
          section: SECTIONS.indexOf(a.section) !== -1 ? a.section : 'other' };
      }
      case 'removeBuyItem': {
        if (typeof a.item !== 'string') return null;
        var n = normalizePantryTerm(a.item);
        if (!weekExtras().some(function(x){ return normalizePantryTerm(x.item) === n; })) return null;
        return { type:'removeBuyItem', item: a.item };
      }
      case 'addPantry': {
        if (typeof a.name !== 'string' || !a.name.trim()) return null;
        if (pantryHas(a.name)) return null;
        return { type:'addPantry', name: a.name.trim(),
          section: SECTIONS.indexOf(a.section) !== -1 ? a.section : 'other', low: !!a.low };
      }
      case 'removePantry': {
        if (typeof a.name !== 'string' || !pantryHas(a.name)) return null;
        return { type:'removePantry', name: a.name };
      }
      case 'setPantryLow': {
        if (typeof a.name !== 'string' || !pantryHas(a.name)) return null;
        return { type:'setPantryLow', name: a.name, low: !!a.low };
      }
      default: return null;
    }
  }

  // The sentence the household reads before deciding. Anything that rewrites
  // prose carries the whole new text, because "updates the method" is not
  // something anyone can consent to without seeing it.
  function describeAction(a){
    switch (a.type){
      case 'updateMeal': {
        var keys = Object.keys(a.changes);
        var d = { title: 'Change ' + a.meal.name, fields: [] };
        keys.forEach(function(k){
          if (k === 'method'){
            d.fields.push({ label: 'Method', before: a.meal.method || '(nothing written)', after: a.changes.method, long: true });
          } else if (k === 'notes'){
            d.fields.push({ label: 'Notes', before: a.meal.notes || '(none)', after: a.changes.notes, long: true });
          } else {
            d.fields.push({ label: k.charAt(0).toUpperCase() + k.slice(1), before: String(a.meal[k] || '—'), after: String(a.changes[k]) });
          }
        });
        return d;
      }
      case 'addIngredient':
        return { title: 'Add to ' + a.meal.name, fields: [{ label: 'Ingredient', after: [a.quantity, a.unit, a.item].filter(Boolean).join(' ') }] };
      case 'removeIngredient':
        return { title: 'Remove from ' + a.meal.name, fields: [{ label: 'Ingredient', before: a.item, after: '(gone)' }] };
      case 'updateIngredient': {
        var cur = a.meal.ingredients[a.index];
        var before = [cur.quantity, cur.unit, cur.item].filter(Boolean).join(' ');
        var merged = Object.assign({}, cur, a.patch);
        var after = [merged.quantity, merged.unit, merged.item].filter(Boolean).join(' ');
        return { title: 'Change an ingredient in ' + a.meal.name, fields: [{ label: 'Ingredient', before: before, after: after }] };
      }
      case 'addMeal':
        return { title: 'Add a new meal', fields: [
          { label: 'Name', after: a.name },
          { label: 'Ingredients', after: a.ingredients.length ? a.ingredients.map(function(i){ return [i.quantity, i.unit, i.item].filter(Boolean).join(' '); }).join(', ') : '(none)' },
          { label: 'Method', after: a.method || '(none written)', long: true }
        ]};
      case 'setWeekSlots': return { title: 'Plan for ' + a.slots + ' dinner' + (a.slots===1?'':'s') + ' this week',
        fields: [{ label: 'Dinners', before: String(a.from), after: String(a.slots) }].concat(
          a.losing.length ? [{ label: 'Drops', after: a.losing.join(', ') }] : []) };
      case 'addToWeek':    return { title: 'Add ' + a.meal.name + ' to this week', fields: [] };
      case 'removeFromWeek': return { title: 'Take ' + a.meal.name + ' out of this week', fields: [] };
      case 'addBuyItem':   return { title: 'Add to the buy list', fields: [{ label: 'Item', after: [a.quantity, a.unit, a.item].filter(Boolean).join(' ') }] };
      case 'removeBuyItem': return { title: 'Take “' + a.item + '” off the buy list', fields: [] };
      case 'addPantry':    return { title: 'Add to the pantry', fields: [{ label: 'Item', after: a.name + (a.low ? ' (running low)' : '') }] };
      case 'removePantry': return { title: 'Remove “' + a.name + '” from the pantry', fields: [] };
      case 'setPantryLow': return { title: (a.low ? 'Flag “' : 'Un-flag “') + a.name + '” ' + (a.low ? 'as running low' : 'as stocked up'), fields: [] };
      default: return { title: 'Unknown change', fields: [] };
    }
  }

  async function applyAssistantAction(a){
    switch (a.type){
      case 'updateMeal':
        return saveMeal(Object.assign({}, findMealById(a.mealId) || a.meal, a.changes));
      case 'addIngredient': {
        var m1 = findMealById(a.mealId); if (!m1) return;
        var flag = autoFlagIngredient(a.item);
        var next1 = (m1.ingredients || []).concat([{
          item: a.item, quantity: a.quantity, unit: a.unit, section: a.section,
          pantryStaple: false, flag: flag ? flag.flag : null, substitute: flag ? flag.substitute : ''
        }]);
        return saveMeal(Object.assign({}, m1, { ingredients: next1 }));
      }
      case 'removeIngredient': {
        var m2 = findMealById(a.mealId); if (!m2) return;
        var idx = findIngredient(m2, a.item); if (idx === -1) return;
        var next2 = m2.ingredients.slice(); next2.splice(idx, 1);
        return saveMeal(Object.assign({}, m2, { ingredients: next2 }));
      }
      case 'updateIngredient': {
        var m3 = findMealById(a.mealId); if (!m3) return;
        var i3 = findIngredient(m3, a.item); if (i3 === -1) return;
        var next3 = m3.ingredients.slice();
        var merged3 = Object.assign({}, next3[i3], a.patch);
        if (a.patch.item){
          var f3 = autoFlagIngredient(a.patch.item);
          merged3.flag = f3 ? f3.flag : null;
          merged3.substitute = f3 ? f3.substitute : '';
        }
        next3[i3] = merged3;
        return saveMeal(Object.assign({}, m3, { ingredients: next3 }));
      }
      case 'addMeal': {
        var fresh = blankMeal();
        fresh.name = a.name; fresh.base = a.base; fresh.servings = a.servings; fresh.method = a.method;
        fresh.ingredients = mapIngredients(a.ingredients);
        fresh.notes = 'Added by the assistant — check the method and ingredients before cooking it.';
        return saveMeal(fresh);
      }
      case 'setWeekSlots':
        return applyWeekSlots(a.slots);
      case 'addToWeek': {
        var ids = getWeekIds(); var slot = ids.indexOf(null);
        if (slot === -1) return;
        ids[slot] = a.mealId;
        return updateWeek({ mealIds: ids, weekStart: (weekDoc && weekDoc.weekStart) || mondayIso(), started: true });
      }
      case 'removeFromWeek': {
        var ids2 = getWeekIds(); var at = ids2.indexOf(a.mealId);
        if (at === -1) return;
        ids2[at] = null;
        return updateWeek({ mealIds: ids2 });
      }
      case 'addBuyItem':
        return updateWeek({ extraItems: weekExtras().concat([{ item: a.item, quantity: a.quantity, unit: a.unit, section: a.section }]) });
      case 'removeBuyItem': {
        var nb = normalizePantryTerm(a.item);
        return updateWeek({ extraItems: weekExtras().filter(function(x){ return normalizePantryTerm(x.item) !== nb; }) });
      }
      case 'addPantry':
        return savePantry(pantry.concat([{ name: a.name, section: a.section, low: a.low }]));
      case 'removePantry': {
        var np = normalizePantryTerm(a.name);
        return savePantry(pantry.filter(function(p){ return normalizePantryTerm(p.name) !== np; }));
      }
      case 'setPantryLow': {
        var nl = normalizePantryTerm(a.name);
        return savePantry(pantry.map(function(p){
          return normalizePantryTerm(p.name) === nl ? Object.assign({}, p, { low: a.low }) : p;
        }));
      }
    }
  }

  function sampleErrorMessage(e){
    var code = e && e.code;
    if (code==='not_granted' || code==='sampling_disabled' || code==='not_declared' || code==='capability_disabled' || code==='capability_removed'){
      sampleUnavailable = true;
      return 'AI extraction isn’t available in this view — fill in the fields below by hand.';
    }
    if (code==='rate_limited') return 'Too many requests right now — try again in a minute.';
    if (code==='invalid_json') return 'Couldn’t get a clean structured answer — try again, or fill in the fields yourself.';
    if (code==='cancelled') return null;
    return 'Something went wrong reading that (' + (e && e.message ? e.message : 'unknown error') + ') — you can still fill in the fields by hand.';
  }

  // Set for exactly one render, by any code that has just changed ui.formDraft
  // programmatically and needs that to win over what's currently in the inputs.
  var suppressFormSync = false;
  function renderFromDraft(){ suppressFormSync = true; render(); }

  // ---------- cook mode ----------
  // Splits a written method into steps. Recipes get typed every which way —
  // "1." / "1)" / "Step 3:" / bare paragraphs — so the numbering is stripped and
  // re-applied, otherwise step 4 renders as "4. 4. Add the beans".
  function cookSteps(method){
    var raw = String(method || '').split(/\r?\n/);
    var steps = [];
    raw.forEach(function(line){
      var t = line.trim();
      if (!t) return;
      t = t.replace(/^step\s*\d+\s*[:.)-]?\s*/i, '')
           .replace(/^\d+\s*[.):-]\s*/, '')
           .replace(/^[-–—•*]\s*/, '')
           .trim();
      if (t) steps.push(t);
    });
    return steps;
  }

  // Keeping the screen on is the whole difference between a usable cook mode and
  // one you unlock with wet hands every 30 seconds. Not supported everywhere and
  // it can be refused, so every path is guarded and nothing depends on it.
  var wakeLockSentinel = null;
  function requestWakeLock(){
    try {
      if (!navigator.wakeLock || !navigator.wakeLock.request) return;
      navigator.wakeLock.request('screen').then(function(lock){
        wakeLockSentinel = lock;
      }).catch(function(){});
    } catch(e){}
  }
  function releaseWakeLock(){
    try { if (wakeLockSentinel && wakeLockSentinel.release) wakeLockSentinel.release(); } catch(e){}
    wakeLockSentinel = null;
  }

  // Which ingredients a step actually calls for, matched against the step text.
  //
  // Longest name first, blanking each match out of the text as it goes. That
  // ordering is the whole trick: "add the butter beans" would otherwise match
  // both "butter beans" AND "butter", putting a block of dairy on a step that
  // never mentions it. Masking the longer phrase first leaves nothing for the
  // shorter name to hit — while "melt the butter, then add the butter beans"
  // still correctly matches both, because each has its own text to match.
  function stepIngredientIndexes(m, stepText){
    var ings = (m && m.ingredients) || [];
    var order = ings.map(function(ing, idx){
      return { idx: idx, name: normalizePantryTerm(ing.item) };
    }).filter(function(x){ return x.name; });
    order.sort(function(a,b){ return b.name.length - a.name.length; });

    var text = ' ' + normalizePantryTerm(stepText) + ' ';
    var found = {};
    order.forEach(function(x){
      var hit = maskFirstMatch(text, x.name);
      if (hit == null){
        // "butter beans" written as just "the beans" in the step: fall back to
        // the head noun, which is what a cook actually says out loud.
        var words = x.name.split(' ');
        var head = words[words.length - 1];
        if (words.length > 1 && head.length >= 3) hit = maskFirstMatch(text, head);
      }
      if (hit != null){ text = hit; found[x.idx] = true; }
    });
    return ings.map(function(_, idx){ return idx; }).filter(function(idx){ return found[idx]; });
  }

  // Returns the text with the first whole-word occurrence blanked out, or null
  // if the phrase isn't there. Shares matchesKeyword's word-boundary rules, so
  // "oil" still doesn't match "boil".
  function maskFirstMatch(text, phrase){
    var esc = phrase.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var re = new RegExp('(^|[^a-z])(' + esc + '(?:e?s)?)([^a-z]|$)', 'i');
    var mm = re.exec(text);
    if (!mm) return null;
    return text.slice(0, mm.index) + mm[1] + ' '.repeat(mm[2].length) + mm[3] + text.slice(mm.index + mm[0].length);
  }

  function cookUsed(){ return (ui.cook && ui.cook.used) || {}; }

  // One row, used by both the prep list and the per-step list, so a tick made in
  // one place reads as ticked in the other — it's the same claim either way.
  function renderCookIngRow(ing, idx){
    var qty = [ing.quantity, ing.unit].filter(Boolean).join(' ');
    var on = !!cookUsed()[idx];
    return '<li class="cook-ing-row'+(on ? ' used' : '')+'">' +
      '<label>' +
        '<input type="checkbox" data-action="toggleCookIngredient" data-id="'+idx+'"'+(on ? ' checked' : '')+'>' +
        '<span class="cook-qty">'+escapeHtml(qty || '—')+'</span>' +
        '<span class="cook-ing-name">'+escapeHtml(ing.item||'')+'</span>' +
      '</label>' +
      (ing.flag ? '<div class="g-flag">'+escapeHtml(flagLabel(ing.flag))+(ing.substitute ? ' — '+escapeHtml(ing.substitute) : '')+'</div>' : '') +
    '</li>';
  }
  function renderCookIngList(m, indexes){
    return '<ul class="cook-ing">' + indexes.map(function(idx){
      return renderCookIngRow(m.ingredients[idx], idx);
    }).join('') + '</ul>';
  }

  function cookMeal(){
    if (!ui.cook) return null;
    return meals.filter(function(m){ return m.id === ui.cook.id; })[0] || null;
  }

  // Step 0 is the prep screen: everything you need out on the counter, with the
  // household's allergen flags where you can't miss them, before any cooking.
  function renderCookOverlay(){
    var m = cookMeal();
    if (!m) return '';
    var steps = cookSteps(m.method);
    var i = ui.cook.step;
    var cookedToday = weekCookedOn(m.id);
    var html = '<div class="overlay cook-overlay" id="cook-overlay"><div class="cook-sheet">' +
      '<div class="cook-head">' +
        '<div><div class="cook-name">'+escapeHtml(m.name)+'</div>' +
        '<div class="cook-progress">'+(i === 0 ? 'Get everything ready' : 'Step '+i+' of '+steps.length)+'</div></div>' +
        '<button class="close-x" data-action="closeCook" aria-label="Close">&times;</button>' +
      '</div>';

    var allIdx = (m.ingredients || []).map(function(_, k){ return k; });
    var usedCount = allIdx.filter(function(k){ return cookUsed()[k]; }).length;

    if (i === 0){
      html += '<div class="cook-body">' +
        '<h4 class="cook-label">You need' + (allIdx.length ? ' &middot; '+usedCount+' of '+allIdx.length+' out' : '') + '</h4>';
      if (allIdx.length){
        html += renderCookIngList(m, allIdx);
      } else {
        html += '<p class="muted">No ingredients written down for this one.</p>';
      }
      html += '<p class="muted" style="margin-top:14px;">Makes '+(parseFloat(m.servings)||4)+' servings' +
        (hasMacros(m) ? ' &middot; '+escapeHtml(macroSummary(m,'per'))+' each' : '') + '.</p>';
      html += '</div>';
    } else if (steps.length){
      var stepIdx = stepIngredientIndexes(m, steps[i-1]);
      var showAll = !!ui.cook.showAll;
      html += '<div class="cook-body cook-step-body">' +
        '<div class="cook-step-num">'+i+'</div>' +
        '<div class="cook-step-text">'+escapeHtml(steps[i-1])+'</div>';
      if (stepIdx.length && !showAll){
        var stepUsed = stepIdx.filter(function(k){ return cookUsed()[k]; }).length;
        html += '<div class="cook-step-ing">' +
          '<h4 class="cook-label">For this step &middot; '+stepUsed+' of '+stepIdx.length+' in</h4>' +
          renderCookIngList(m, stepIdx) +
        '</div>';
      } else if (showAll && allIdx.length){
        html += '<div class="cook-step-ing">' +
          '<h4 class="cook-label">Everything &middot; '+usedCount+' of '+allIdx.length+' in</h4>' +
          renderCookIngList(m, allIdx) +
        '</div>';
      }
      if (allIdx.length){
        html += '<button type="button" class="btn-link cook-showall" data-action="toggleCookShowAll">' +
          (showAll ? 'Just this step' : (stepIdx.length ? 'Show the full list' : 'Nothing to add here — show the full list')) +
        '</button>';
      }
      html += '</div>';
    } else {
      html += '<div class="cook-body"><p class="muted">No method written down for this one yet — add one from the Meals tab and it’ll show up here as steps.</p></div>';
    }

    html += '<div class="cook-foot">' +
      '<button class="btn btn-ghost cook-nav" data-action="cookPrev"'+(i === 0 ? ' disabled' : '')+'>Back</button>';
    if (i < steps.length){
      html += '<button class="btn btn-primary cook-nav" data-action="cookNext">'+(i === 0 ? 'Start cooking' : 'Next')+'</button>';
    } else {
      html += '<button class="btn btn-forest cook-nav" data-action="finishCook" data-id="'+m.id+'"'+(ui.cookSaving?' disabled':'')+'>' +
        (ui.cookSaving ? 'Saving…' : (cookedToday ? 'Done' : 'Done — mark as cooked')) + '</button>';
    }
    html += '</div>';
    if (ui.cookError) html += '<div class="warnbox warn" style="margin:0 20px 16px;">'+escapeHtml(ui.cookError)+'</div>';
    return html + '</div></div>';
  }

  // ---------- rendering ----------
  // Every render() replaces #app's whole innerHTML (no virtual DOM), which would
  // otherwise yank focus and cursor position out of whatever text field the
  // household is mid-sentence in (search boxes, the import textarea). Capture and
  // restore focus by element id across the rebuild so typing stays uninterrupted.
  function render(){
    var app = document.getElementById('app');
    var focusInfo = null;
    // Reading selectionStart/End THROWS (InvalidStateError) when the focused
    // element is an input type that has no text selection — number and date,
    // both of which the meal form uses (servings, effort minutes, times cooked,
    // last cooked). Unguarded, that aborts the whole render and freezes the page
    // on exactly the screen you're most likely to be typing in.
    try {
      var active = document.activeElement;
      if (active && app.contains(active) && active.id){
        var selStart = null, selEnd = null;
        try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch(e){}
        focusInfo = { id: active.id, start: selStart, end: selEnd };
      }
    } catch(e){ focusInfo = null; }
    // If the meal form is already on screen, capture whatever's typed into it before
    // rebuilding — a re-render can be triggered by the OTHER person's edit arriving
    // over the shared db, not just a local click, and that must never erase typing
    // that hasn't been explicitly saved yet.
    //
    // EXCEPT when the caller has just written to formDraft itself. This read can't
    // tell "the user typed this" from "code just set this", so an AI adjustment,
    // a removed ingredient row or Mark-cooked-today would be silently reverted by
    // the stale DOM a moment after being applied. renderFromDraft() suppresses it.
    var skipSync = suppressFormSync;
    suppressFormSync = false;
    if (!skipSync && ui.formOpen && ui.formDraft && document.getElementById('form-overlay')){
      try { syncFormDraftFromDom(); } catch(e){}
    }
    // The This Week editors live inline in a page that re-renders whenever the
    // other person changes something, so their typing needs the same protection
    // the meal form gets — and the same escape hatch when code has just written
    // to them itself.
    if (!skipSync){
      try { syncSlotEditFromDom(); } catch(e){}
      try { syncTargetsFromDom(); } catch(e){}
    }

    // A crash anywhere in the render below (bad data, an edge case this code
    // missed) used to leave the page frozen mid-rebuild with no way back short of
    // reloading — which, since the bad state usually persists, reloaded straight
    // into the same crash. This boundary catches that instead and offers a way
    // back to a known-good screen.
    try {
      // In self-hosted mode nothing renders until we know who this is and which
      // household they're in — an app that looks normal while dropping every
      // write is the worst of the available failures.
      if (supa && (!authReady || !session || !householdId)){
        app.innerHTML = renderAuthGate();
        return;
      }
      var html = header();
      if (!dataLoaded){
        html += '<div class="card hero"><p>Loading the list&hellip;</p></div>';
        app.innerHTML = html;
        return;
      }
      if (currentTab === 'week') html += renderWeekTab();
      else if (currentTab === 'grocery') html += renderGroceryTab();
      else if (currentTab === 'history') html += renderHistoryTab();
      else if (currentTab === 'meals') html += renderMealsTab();
      else if (currentTab === 'pantry') html += renderPantryTab();
      else if (currentTab === 'import') html += renderImportTab();

      if (ui.cook) html += renderCookOverlay();
      if (ui.formOpen) html += renderMealFormOverlay();
      if (ui.weekPickerOpen) html += renderWeekPickerOverlay();
      html += footnote();
      html += renderAssistant();
      if (ui.toast) html += '<div class="toast">'+escapeHtml(ui.toast)+'</div>';
      app.innerHTML = html;
    } catch(err){
      app.innerHTML = header() + '<div class="card" style="margin-top:16px;">' +
        '<h3 style="margin-bottom:8px;">Something went wrong showing this screen</h3>' +
        '<p class="muted" style="margin-bottom:12px;">'+escapeHtml(err && err.message ? err.message : String(err))+'</p>' +
        '<button class="btn btn-primary" data-action="recoverFromError">Back to This Week</button>' +
      '</div>';
      return;
    }

    if (ui.asst.open && ui.asst.scrollWanted){
      ui.asst.scrollWanted = false;
      var body = document.getElementById('asst-body');
      if (body) body.scrollTop = body.scrollHeight;
    }
    if (ui.scrollToGrocery){
      ui.scrollToGrocery = false;
      var target = document.getElementById('grocery-list');
      if (target && target.scrollIntoView){
        try { target.scrollIntoView({ behavior:'smooth', block:'start' }); } catch(e){ target.scrollIntoView(); }
      }
    }
    if (focusInfo){
      var el = document.getElementById(focusInfo.id);
      if (el){
        try { el.focus(); } catch(e){}
        if (typeof focusInfo.start === 'number' && el.setSelectionRange){
          try { el.setSelectionRange(focusInfo.start, focusInfo.end); } catch(e){}
        }
      }
    }
  }

  function header(){
    return '' +
      '<div class="topbar"><div class="brand"><h1>Meal Planner</h1><span class="tag mono">household kitchen ops</span></div></div>' +
      // Falling back to this device is survivable; doing it silently is not —
      // they'd carry on planning a week their partner never sees.
      (authError && !supa
        ? '<div class="warnbox warn">Couldn’t reach the server (' + escapeHtml(authError) + '). ' +
          'The app is running on this device only, so nothing will sync until it’s back. Reload once you have a connection.</div>'
        : '') +
      '<div class="tabs">' +
        tabBtn('week','This Week') + tabBtn('grocery', groceryTabLabel()) + tabBtn('meals','Meals') +
        tabBtn('history','History') + tabBtn('pantry','Pantry') + tabBtn('import','Import') +
      '</div>' +
      (ui.actionError
        ? '<div class="warnbox warn" style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;">' +
          '<span>That didn’t go through: '+escapeHtml(ui.actionError)+'</span>' +
          '<button class="btn-link" data-action="dismissActionError">Dismiss</button></div>'
        : '');
  }
  function tabBtn(key, label){
    return '<button class="tab'+(currentTab===key?' active':'')+'" data-action="setTab" data-id="'+key+'">'+label+'</button>';
  }
  function footnote(){
    var msg = supa
      ? 'Signed in — everything here syncs live with everyone in your household.'
      : (localMode
        ? 'Saved on this device only — open the same link on both phones to keep the shared list in sync.'
        : 'The meal list and this week’s plan sync live between both of you.');
    return '<div class="footnote">' + msg + '</div>';
  }

  // ---- Auth screens (self-hosted only) ----
  //
  // Two gates, in order: signed in, then in a household. They are separate
  // because they fail for different reasons and each has its own way out.
  function renderAuthGate(){
    var html = '<div class="topbar"><div class="brand"><h1>Meal Planner</h1>' +
      '<span class="tag mono">household kitchen ops</span></div></div>';
    if (!authReady){
      return html + '<div class="card hero"><p>Checking your session&hellip;</p></div>';
    }
    if (authError){
      html += '<div class="warnbox warn">'+escapeHtml(authError)+'</div>';
    }
    return html + (session ? renderHouseholdSetup() : renderSignIn());
  }

  function renderSignIn(){
    var mode = ui.authMode;
    return '<div class="card" style="max-width:460px;margin:24px auto;">' +
      '<h2 style="font-size:1.35rem;margin-bottom:6px;">'+(mode === 'signup' ? 'Create an account' : 'Sign in')+'</h2>' +
      '<p class="muted" style="margin-bottom:16px;">'+(mode === 'signup'
        ? 'One account each. You’ll join the same household on the next screen, and share one list.'
        : 'Welcome back.')+'</p>' +
      '<form data-submit-action="submitAuth">' +
        '<div class="field"><label for="auth-email">Email</label>' +
          '<input type="email" id="auth-email" autocomplete="email" required value="'+escapeHtml(ui.authEmail)+'"></div>' +
        '<div class="field"><label for="auth-password">Password</label>' +
          '<input type="password" id="auth-password" autocomplete="'+(mode === 'signup' ? 'new-password' : 'current-password')+'" required minlength="8"></div>' +
        (mode === 'signup' ? '<p class="muted" style="margin:-6px 0 14px;font-size:0.78rem;">At least 8 characters.</p>' : '') +
        (ui.authFormError ? '<div class="warnbox warn">'+escapeHtml(ui.authFormError)+'</div>' : '') +
        (ui.authNotice ? '<div class="warnbox info">'+escapeHtml(ui.authNotice)+'</div>' : '') +
        '<button type="submit" class="btn btn-primary" style="width:100%;"'+(ui.authBusy?' disabled':'')+'>' +
          (ui.authBusy ? 'Working…' : (mode === 'signup' ? 'Create account' : 'Sign in')) + '</button>' +
      '</form>' +
      '<p class="muted" style="margin-top:14px;text-align:center;">' +
        (mode === 'signup'
          ? 'Already have one? <button type="button" class="btn-link" data-action="setAuthMode" data-id="signin">Sign in</button>'
          : 'New here? <button type="button" class="btn-link" data-action="setAuthMode" data-id="signup">Create an account</button>') +
      '</p></div>';
  }

  function renderHouseholdSetup(){
    var email = (session && session.user && session.user.email) || '';
    return '<div class="card" style="max-width:520px;margin:24px auto;">' +
      '<h2 style="font-size:1.35rem;margin-bottom:6px;">One more step</h2>' +
      '<p class="muted" style="margin-bottom:18px;">Signed in as '+escapeHtml(email)+'. A household is the shared list — start one, or join the one that already exists.</p>' +
      (ui.authFormError ? '<div class="warnbox warn">'+escapeHtml(ui.authFormError)+'</div>' : '') +
      '<div class="field"><label for="hh-name">Start a new household</label>' +
        '<input type="text" id="hh-name" placeholder="Our kitchen" value="'+escapeHtml(ui.householdName)+'"></div>' +
      '<button type="button" class="btn btn-forest" style="width:100%;" data-action="createHousehold"'+(ui.authBusy?' disabled':'')+'>' +
        (ui.authBusy ? 'Working…' : 'Create it') + '</button>' +
      '<div style="display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--ink-soft);font-size:0.72rem;font-weight:800;letter-spacing:0.12em;">' +
        '<span style="flex:1;height:1.5px;background:var(--line);"></span>OR<span style="flex:1;height:1.5px;background:var(--line);"></span></div>' +
      '<div class="field"><label for="hh-code">Join with an invite code</label>' +
        '<input type="text" id="hh-code" placeholder="e.g. 7F3A9B2C" autocapitalize="characters" value="'+escapeHtml(ui.joinCode)+'"></div>' +
      '<button type="button" class="btn btn-ghost" style="width:100%;" data-action="joinHousehold"'+(ui.authBusy?' disabled':'')+'>Join</button>' +
      '<p class="muted" style="margin-top:18px;text-align:center;">' +
        '<button type="button" class="btn-link" data-action="signOut">Sign out</button></p>' +
    '</div>';
  }

  // Lives on the Pantry tab's neighbour — the Import tab — because that's where
  // the other household-level settings already are.
  function renderAccountSection(){
    if (!supa || !session) return '';
    var email = (session.user && session.user.email) || '';
    var html = '<div class="card" style="margin-top:16px;">' +
      '<h3 style="margin-bottom:6px;">Household</h3>' +
      '<p class="muted" style="margin-bottom:12px;">Signed in as '+escapeHtml(email)+'.</p>';
    if (ui.inviteCode){
      html += '<div class="warnbox info"><strong>Invite code:</strong> <span class="mono">'+escapeHtml(ui.inviteCode)+'</span><br>' +
        'Give this to whoever is joining. They create an account, then enter it. Anyone with it can join, so share it directly and rotate it afterwards.</div>';
    }
    html += '<div class="row-actions">' +
      '<button type="button" class="btn btn-ghost btn-sm" data-action="showInviteCode"'+(ui.authBusy?' disabled':'')+'>'+(ui.inviteCode ? 'Refresh' : 'Show the invite code')+'</button>' +
      (ui.inviteCode ? '<button type="button" class="btn btn-ghost btn-sm" data-action="rotateInviteCode"'+(ui.authBusy?' disabled':'')+'>Make a new code</button>' : '') +
      '<button type="button" class="btn-link" data-action="signOut">Sign out</button>' +
    '</div></div>';
