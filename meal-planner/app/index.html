  }

  function scrollAsstToEnd(){
    ui.asst.scrollWanted = true;
    var body = document.getElementById('asst-body');
    if (body) body.scrollTop = body.scrollHeight;
  }

  // ---- Assistant bubble ----
  function renderAssistant(){
    if (!sampleFn || sampleUnavailable) return '';
    if (ui.cook || ui.formOpen || ui.weekPickerOpen) return '';
    var a = ui.asst;
    if (!a.open){
      return '<button type="button" class="asst-bubble" data-action="openAsst" aria-label="Ask the assistant">' +
        '<span class="asst-bubble-icon">✳</span><span class="asst-bubble-text">Ask</span></button>';
    }

    var html = '<div class="asst-panel" id="asst-panel">' +
      '<div class="asst-head">' +
        '<div><div class="asst-title">Assistant</div>' +
        '<div class="asst-sub">Tell it what to change. Nothing happens until you say so.</div></div>' +
        '<button class="close-x" data-action="closeAsst" aria-label="Close">&times;</button>' +
      '</div>' +
      '<div class="asst-body" id="asst-body">';

    if (!a.messages.length && !a.pending){
      html += '<div class="asst-empty">' +
        '<p class="muted">Things it can do:</p>' +
        '<ul class="asst-eg">' +
          '<li>“swap the butter in the traybake for olive oil”</li>' +
          '<li>“add coriander to the curry, a big handful”</li>' +
          '<li>“we’re out of rice, put it on the list”</li>' +
          '<li>“put the traybake in this week”</li>' +
        '</ul></div>';
    }

    a.messages.forEach(function(m){
      html += '<div class="asst-msg ' + (m.role === 'user' ? 'from-you' : 'from-ai') + '">' +
        escapeHtml(m.text).replace(/\n/g, '<br>') + '</div>';
      if (m.role === 'assistant' && m.question){
        html += '<div class="asst-question">' + escapeHtml(m.question) + '</div>';
        if (m.options && m.options.length){
          html += '<div class="asst-options">' + m.options.map(function(opt, i){
            return '<button type="button" class="g-chip" data-action="asstOption" data-id="'+i+'">'+escapeHtml(opt)+'</button>';
          }).join('') + '</div>';
        }
      }
    });

    if (a.busy) html += '<div class="asst-msg from-ai asst-thinking">Thinking&hellip;</div>';
    if (a.error) html += '<div class="warnbox warn">'+escapeHtml(a.error)+'</div>';
    if (a.pending) html += renderAsstPending(a.pending);

    html += '</div>';

    // The composer is hidden while changes are waiting, so there is exactly one
    // thing to do: decide about them.
    if (!a.pending){
      html += '<form class="asst-foot" data-submit-action="sendAsst">' +
        '<input type="text" id="asst-input" placeholder="What do you want to change?" value="'+escapeHtml(a.input)+'" data-action="asstInput" autocomplete="off">' +
        '<button type="submit" class="btn btn-primary btn-sm"'+((a.busy || !a.input.trim())?' disabled':'')+'>Send</button>' +
      '</form>';
    }
    return html + '</div>';
  }

  function renderAsstPending(pending){
    var chosen = pending.chosen || {};
    var count = pending.actions.filter(function(_, i){ return chosen[i] !== false; }).length;
    var html = '<div class="asst-pending">' +
      '<div class="asst-pending-head">' + pending.actions.length + ' change' + (pending.actions.length===1?'':'s') + ' ready. Have a read.</div>';

    pending.actions.forEach(function(act, i){
      var d = describeAction(act);
      var on = chosen[i] !== false;
      html += '<div class="asst-change'+(on?'':' off')+'">' +
        '<label class="asst-change-head">' +
          '<input type="checkbox" data-action="toggleAsstChange" data-id="'+i+'"'+(on?' checked':'')+'>' +
          '<span>'+escapeHtml(d.title)+'</span>' +
        '</label>';
      d.fields.forEach(function(f){
        html += '<div class="asst-field"><span class="asst-field-label">'+escapeHtml(f.label)+'</span>';
        if (f.long){
          if (f.before) html += '<div class="asst-before"><span class="asst-tag">was</span><pre>'+escapeHtml(f.before)+'</pre></div>';
          html += '<div class="asst-after"><span class="asst-tag">now</span><pre>'+escapeHtml(f.after)+'</pre></div>';
        } else {
          html += '<div class="asst-inline">' +
            (f.before ? '<s>'+escapeHtml(f.before)+'</s> &rarr; ' : '') +
            '<strong>'+escapeHtml(f.after)+'</strong></div>';
        }
        html += '</div>';
      });
      html += '</div>';
    });

    if (pending.dropped){
      html += '<div class="g-meta" style="margin-top:8px;">' + pending.dropped +
        ' suggestion' + (pending.dropped===1?'':'s') + ' didn’t match anything in your list, so ' +
        (pending.dropped===1?'it was':'they were') + ' left out.</div>';
    }

    html += '<div class="asst-pending-foot">' +
      '<button type="button" class="btn btn-ghost btn-sm" data-action="discardAsst">Discard</button>' +
      '<button type="button" class="btn btn-primary btn-sm" data-action="applyAsst"'+((!count || pending.applying)?' disabled':'')+'>' +
        (pending.applying ? 'Applying…' : (count ? 'Apply ' + count + ' change' + (count===1?'':'s') : 'Nothing ticked')) +
      '</button></div>';
    return html + '</div>';
  }

  // ---- Week tab ----
  // How many dinners this week is planning for. Five was hardcoded in a dozen
  // places; it lives here now and everything else asks.
  var MIN_SLOTS = 1, MAX_SLOTS = 10, DEFAULT_SLOTS = 5;
  function weekSlots(){
    var n = parseInt(weekDoc && weekDoc.slots, 10);
    if (isNaN(n)) return DEFAULT_SLOTS;
    return Math.max(MIN_SLOTS, Math.min(MAX_SLOTS, n));
  }
  function emptySlots(n){
    var out = [];
    for (var i = 0; i < n; i++) out.push(null);
    return out;
  }
  var NUMBER_WORDS = ['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
  function spell(n){ return NUMBER_WORDS[n] || String(n); }

  function getWeekIds(){
    var n = weekSlots();
    var ids = (weekDoc && weekDoc.mealIds) ? weekDoc.mealIds.slice() : [];
    while (ids.length < n) ids.push(null);
    return ids.slice(0, n);
  }
  function selectedMeals(){
    return getWeekIds().map(function(id){ return id ? meals.find(function(m){ return m.id===id; }) : null; }).filter(Boolean);
  }
  // What got cooked this week, as { mealId: 'YYYY-MM-DD' }. Kept on the week
  // rather than derived from the meal's lastCooked, because lastCooked is a
  // single date and says nothing about which week it belonged to.
  function weekCookedMap(){
    return (weekDoc && weekDoc.cooked && typeof weekDoc.cooked === 'object') ? weekDoc.cooked : {};
  }
  function weekCookedOn(mealId){ return weekCookedMap()[mealId] || ''; }

  // Snapshot of the outgoing week, taken before its picks are cleared.
  function buildHistoryEntry(){
    var ids = getWeekIds().filter(Boolean);
    if (!ids.length) return null;
    var cooked = weekCookedMap();
    var entry = {
      weekStart: (weekDoc && weekDoc.weekStart) || mondayIso(),
      meals: ids.map(function(id){
        var m = meals.filter(function(x){ return x.id === id; })[0];
        return {
          id: id,
          name: m ? m.name : 'A meal that has since been deleted',
          tier: m ? m.tier : 'unranked',
          servings: m ? (parseFloat(m.servings) || 4) : 4,
          cookedOn: cooked[id] || ''
        };
      })
    };
    return entry;
  }

  // Seven nights minus what you're cooking. The point of the original five was
  // that two nights stay yours; that idea survives at any number, and stops
  // being true past seven — which is worth saying rather than quietly implying
  // you'll cook eleven dinners in a week.
  function slotBlurb(n){
    var spare = 7 - n;
    if (n === 1) return 'One dinner planned. The other six nights are yours.';
    if (spare > 0) return spell(n).charAt(0).toUpperCase() + spell(n).slice(1) +
      ' dinners planned \u2014 that leaves ' + spell(spare) + ' night' + (spare === 1 ? '' : 's') + ' open, on purpose.';
    if (spare === 0) return 'Seven dinners \u2014 every night of the week planned.';
    return spell(n).charAt(0).toUpperCase() + spell(n).slice(1) + ' dinners \u2014 more than a week, so some of this is for the freezer or for later.';
  }

  function renderSlotStepper(){
    var n = weekSlots();
    var pending = ui.confirmSlots;
    var html = '<div class="slot-stepper">' +
      '<span class="slot-stepper-label">Dinners this week</span>' +
      '<div class="stepper">' +
        '<button type="button" class="step-btn" data-action="setWeekSlots" data-id="'+(n-1)+'"'+(n <= MIN_SLOTS ? ' disabled' : '')+' aria-label="One fewer">&minus;</button>' +
        '<span class="step-value">'+n+'</span>' +
        '<button type="button" class="step-btn" data-action="setWeekSlots" data-id="'+(n+1)+'"'+(n >= MAX_SLOTS ? ' disabled' : '')+' aria-label="One more">+</button>' +
      '</div>' +
    '</div>';
    // Shrinking past a slot that already holds a meal loses that pick, so it
    // says which one before doing it rather than after.
    if (pending){
      html += '<div class="warnbox warn slot-confirm"><strong>Going down to '+pending.next+' drops '+
        (pending.names.length === 1 ? '' : 'these: ') + escapeHtml(pending.names.join(', ')) +
        '.</strong> ' + (pending.names.length === 1 ? 'It stays' : 'They stay') + ' in your Meals list.' +
        '<div class="row-actions" style="margin-top:10px;">' +
          '<button type="button" class="btn btn-primary btn-sm" data-action="confirmWeekSlots">Yes, drop '+(pending.names.length === 1 ? 'it' : 'them')+'</button>' +
          '<button type="button" class="btn-link" data-action="cancelWeekSlots">Cancel</button>' +
        '</div></div>';
    }
    return html;
  }

  function renderWeekTab(){
    var picked = selectedMeals();
    var html = '';
    if (meals.length === 0){
      html += '<div class="card hero"><span class="eyebrow">nothing on the list yet</span>' +
        '<h2>Add a few meals before you plan a week</h2>' +
        '<p>Head to the Meals tab to add one by hand, or Import to pull one in from a recipe PDF or pasted text.</p>' +
        '<button class="btn btn-primary" data-action="setTab" data-id="meals">Go to Meals</button></div>';
      return html;
    }
    if (!weekDoc || !weekDoc.started){
      html += '<div class="card hero"><span class="eyebrow">'+ (weekDoc ? 're-up for next week' : 'new here') +'</span>' +
        '<h2>How many dinners this week?</h2>' +
        '<p>'+escapeHtml(slotBlurb(weekSlots()))+'</p>' +
        renderSlotStepper() +
        '<div class="row-actions" style="justify-content:center;margin-top:6px;">' +
          '<button class="btn btn-primary" data-action="startWeek">Let’s pick</button>' +
          '<button class="btn btn-ghost" data-action="autoPickWeek">Auto-pick for me</button>' +
        '</div></div>';
      return html;
    }
    var rules = computeWarnings(picked);
    html += '<div class="section-head"><h2>This week&rsquo;s '+weekSlots()+'</h2>';
    if (ui.confirmNewWeek){
      html += '<span class="row-actions"><span class="muted">Clear this week’s picks?</span><button class="btn-link" data-action="confirmNewWeek">Yes, start fresh</button><button class="btn-link" data-action="cancelNewWeek">Cancel</button></span>';
    } else if (ui.confirmAutoPick){
      html += '<span class="row-actions"><span class="muted">Replace with a random pick?</span><button class="btn-link" data-action="autoPickWeek">Yes, auto-pick</button><button class="btn-link" data-action="cancelAutoPick">Cancel</button></span>';
    } else {
      html += '<span class="row-actions"><button class="btn btn-ghost btn-sm" data-action="autoPickWeek">Auto-pick</button>' +
        '<button class="btn btn-ghost btn-sm" data-action="askNewWeek">Start a new week</button></span>';
    }
    html += '</div>';
    html += renderSlotStepper();
    html += '<div class="slots">';
    var weekIds = getWeekIds();
    for (var i=0;i<weekIds.length;i++){
      var mid = weekIds[i];
      var m = mid ? meals.find(function(x){ return x.id===mid; }) : null;
      if (m){
        html += renderWeekSlot(m, i);
      } else {
        html += '<div class="slot"><button class="slot-empty-btn" data-action="openWeekPicker" data-id="'+i+'">+ pick meal '+(i+1)+'</button></div>';
      }
    }
    html += '</div>';
    html += '<div class="loose-note">'+escapeHtml(slotBlurb(weekSlots()))+'</div>';
    html += renderWeekMacros(picked);

    if (rules.warnings.length){
      html += '<div class="warnbox warn"><strong>Worth a look:</strong><ul>' + rules.warnings.map(function(w){ return '<li>'+w+'</li>'; }).join('') + '</ul></div>';
    }
    if (rules.infos.length){
      html += '<div class="warnbox info"><ul>' + rules.infos.map(function(w){ return '<li>'+w+'</li>'; }).join('') + '</ul></div>';
    }

    if (picked.length > 0){
      var buyCount = groceryBuyCount(picked);
      html += '<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">' +
        '<div><strong>Grocery list</strong>' +
          '<div class="muted">'+(buyCount ? buyCount+' thing'+(buyCount===1?'':'s')+' to buy for these '+picked.length+' meal'+(picked.length===1?'':'s')+'.' : 'Nothing to buy — it’s all in the cupboard.')+'</div>' +
        '</div>' +
        '<button class="btn btn-forest btn-sm" data-action="setTab" data-id="grocery">Open the list</button>' +
      '</div>';
    }
    return html;
  }

  // How many distinct things are still to buy for these picks. Cheap enough to
  // run on every render, and it's the one number worth putting on a tab.
  function groceryBuyCount(picked){
    var bySection = buildGroceryList(picked);
    var n = 0;
    SECTIONS.forEach(function(s){ bySection[s].forEach(function(i){ if (!i.pantryStaple) n++; }); });
    return n;
  }
  function groceryTabLabel(){
    var picked = selectedMeals();
    if (!picked.length) return 'Grocery';
    var n = groceryBuyCount(picked);
    return n ? 'Grocery (' + n + ')' : 'Grocery';
  }

  function renderGroceryTab(){
    var picked = selectedMeals();
    if (!picked.length){
      return '<div class="section-head"><h2>Grocery list</h2></div>' +
        '<div class="empty-state">Nothing planned yet, so there’s nothing to buy.<br><br>' +
        '<button class="btn btn-primary" data-action="setTab" data-id="week">Pick this week’s meals</button></div>';
    }
    return renderGrocerySection(picked);
  }

  // One line per item — name left, combined total right — with the per-recipe
  // amounts listed underneath, the same way whether one meal needs it or four.
  function renderMealsLine(item){
    var lis = (item.breakdown || []).map(function(b){
      return '<li><span class="bd-qty">'+escapeHtml(formatBreakdownEntry(b))+'</span> '+escapeHtml(b.meal)+'</li>';
    }).join('');
    var html = lis ? '<ul class="breakdown-list">'+lis+'</ul>' : '';
    if (item.waste) html += '<div class="g-meta">Small amount for one meal &mdash; easy to waste.</div>';
    return html;
  }

  // One night on the plan. Carries the two numbers you'd otherwise open the meal
  // to find — what a serving costs you, and how much of it is already in the
  // cupboard — plus a tweak panel, because the edits you make while looking at a
  // week (servings for the night, a macro figure you actually weighed) shouldn't
  // mean a trip to the Meals tab and back.
  function renderWeekSlot(m, i){
    var editing = ui.slotEdit && ui.slotEdit.id === m.id;
    var cov = pantryCoverage(m);
    var targets = weekTargets();
    var perLine = hasMacros(m) ? macroSummary(m, 'per') : '';
    var html = '<div class="slot-wrap'+(editing?' editing':'')+'"><div class="slot"><div class="m-info">' +
      '<div class="m-name">'+escapeHtml(m.name)+'</div>' +
      '<div class="m-meta">' +
        '<span class="chip tier-'+m.tier+'">'+TIER_LABELS[m.tier]+'</span>' +
        (m.base ? '<span class="muted">'+escapeHtml(m.base)+'</span>' : '') +
        (m.effort ? '<span class="muted mono">'+escapeHtml(m.effort)+'</span>' : '') +
        '<span class="muted mono">'+(parseFloat(m.servings)||4)+' servings</span>' +
        (weekCookedOn(m.id) ? '<span class="chip cooked">Cooked</span>' : '') +
      '</div>' +
      (perLine
        ? '<div class="macro-readout" style="margin-top:7px;"><div><span class="macro-scope">Per serving</span> '+
            escapeHtml(perLine) + vsTargetChip(m, targets) + '</div></div>'
        : '<div class="g-meta" style="margin-top:7px;">No macros yet' +
            (canEstimateMacros(m) ? ' — <button type="button" class="btn-link" data-action="estimateMacros" data-id="'+m.id+'"'+(ui.macroEstimating===m.id?' disabled':'')+'>'+(ui.macroEstimating===m.id?'estimating…':'estimate them')+'</button>' : '') +
          '</div>') +
      renderCoverBar(cov, { showShort: true }) +
      '</div>' +
      '<div class="row-actions">' +
        '<button class="btn btn-forest btn-sm" data-action="openCook" data-id="'+m.id+'">Cook</button>' +
        '<button class="btn-link" data-action="showMealShopping" data-id="'+m.id+'">what’s missing</button>' +
        '<button class="btn-link" data-action="toggleSlotEdit" data-id="'+m.id+'">'+(editing?'done':'tweak')+'</button>' +
        '<button class="btn-link" data-action="openWeekPicker" data-id="'+i+'">swap</button>' +
        '<button class="btn-link" data-action="removeFromWeek" data-id="'+i+'">remove</button>' +
      '</div></div>';
    if (editing) html += renderSlotEditor(m);
    return html + '</div>';
  }

  function canEstimateMacros(m){
    return !!sampleFn && !sampleUnavailable && ((m && m.ingredients) || []).length > 0;
  }

  function renderSlotEditor(m){
    var d = ui.slotEdit;
    var servings = parseFloat(d.servings) || 4;
    var preview = { macros: normalizeMacros(d.macros), servings: servings };
    var batch = hasMacros(preview) ? macroSummary(preview, 'total') : '';
    var html = '<div class="slot-edit">' +
      '<h4>Servings for this week</h4>' +
      '<div class="field" style="max-width:160px;margin-bottom:14px;">' +
        '<input type="number" min="1" step="1" id="slot-servings" value="'+escapeHtml(d.servings)+'">' +
      '</div>' +
      '<h4>Macros (per serving)</h4>' +
      '<div class="target-grid">' +
        MACRO_KEYS.map(function(k){
          return '<div><label class="field-label" for="slot-macro-'+k+'">'+MACRO_LABELS[k]+' ('+MACRO_UNITS[k]+')</label>' +
            '<input type="number" min="0" step="any" id="slot-macro-'+k+'" value="'+escapeHtml(d.macros[k])+'"></div>';
        }).join('') +
      '</div>' +
      '<div class="macro-total">'+(batch ? 'Whole batch ('+servings+' servings): '+escapeHtml(batch) : 'Nothing filled in yet.')+'</div>';
    if (canEstimateMacros(m)){
      html += '<div style="margin-top:10px;"><button type="button" class="btn btn-ghost btn-sm" data-action="estimateSlotMacros" data-id="'+m.id+'"'+(ui.macroEstimating===m.id?' disabled':'')+'>'+(ui.macroEstimating===m.id?'Estimating…':'Estimate from ingredients')+'</button></div>';
    }
    if (ui.slotEditError) html += '<div class="warnbox warn" style="margin-top:10px;">'+escapeHtml(ui.slotEditError)+'</div>';
    html += '<div class="form-actions">' +
      '<div></div>' +
      '<div class="row-actions">' +
        '<button type="button" class="btn btn-ghost btn-sm" data-action="cancelSlotEdit">Cancel</button>' +
        '<button type="button" class="btn btn-primary btn-sm" data-action="saveSlotEdit" data-id="'+m.id+'"'+(ui.slotEditSaving?' disabled':'')+'>'+(ui.slotEditSaving?'Saving…':'Save')+'</button>' +
      '</div></div>';
    return html + '</div>';
  }

  // Week rollup: what these picks add up to across every serving they make, plus
  // the average serving, which is the number that actually means something when
  // you're deciding whether the week looks heavy.
  function weekTargets(){
    return normalizeMacros((weekDoc && weekDoc.macroTargets) || {});
  }
  function hasTargets(t){ return MACRO_KEYS.some(function(k){ return t[k] !== ''; }); }

  // Per-serving comparison against whatever target the household set. Deliberately
  // only calories: four percentages on one line is a wall of numbers, and calories
  // is the one people scan. The full comparison lives in the table below.
  function vsTargetChip(m, targets){
    if (!targets || targets.calories === '') return '';
    var per = macroPerServing(m, 'calories');
    if (per == null) return '';
    var pct = Math.round((per / targets.calories) * 100);
    var cls = pct > 110 ? 'over' : (pct < 90 ? 'under' : 'on');
    return '<span class="vs-target '+cls+'">'+pct+'% of target</span>';
  }

  // Week rollup: what these picks add up to across every serving they make, plus
  // the average serving, which is the number that actually means something when
  // you're deciding whether the week looks heavy. The per-meal table underneath
  // is what turns "the week is 3200 kcal" into "and it's the curry that's heavy".
  function renderWeekMacros(picked){
    var withMacros = picked.filter(hasMacros);
    var targets = weekTargets();
    var html = '<div class="card macro-week">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;">' +
        '<h3 style="margin-bottom:0;">Macros this week</h3>' +
        '<div class="row-actions">' +
          (picked.length ? '<button type="button" class="btn-link" data-action="toggleMacroDetail">'+(ui.macroDetailOpen?'Hide the breakdown':'Show per-meal breakdown')+'</button>' : '') +
          '<button type="button" class="btn-link" data-action="toggleMacroTargets">'+(ui.macroTargetsOpen?'Close targets':(hasTargets(targets)?'Edit targets':'Set a target'))+'</button>' +
        '</div>' +
      '</div>';

    if (ui.macroTargetsOpen) html += renderTargetEditor(ui.targetDraft || targets);

    if (!withMacros.length){
      if (!picked.length) return '';
      html += '<p class="muted" style="margin-top:10px;">None of this week’s picks have macros filled in yet. Hit “tweak” on a meal above to add or estimate them.</p>';
      return html + '</div>';
    }

    var totals = {}, servingCount = 0;
    MACRO_KEYS.forEach(function(k){ totals[k] = null; });
    withMacros.forEach(function(m){
      servingCount += (parseFloat(m.servings) || 4);
      MACRO_KEYS.forEach(function(k){
        var t = macroTotal(m, k);
        if (t == null) return;
        totals[k] = (totals[k] || 0) + t;
      });
    });
    var totalParts = [], avgParts = [], avgValues = {};
    MACRO_KEYS.forEach(function(k){
      if (totals[k] == null) return;
      var total = Math.round(totals[k]*10)/10;
      var avg = servingCount ? Math.round((totals[k]/servingCount)*10)/10 : null;
      avgValues[k] = avg;
      totalParts.push(k === 'calories' ? total+' kcal' : total+MACRO_UNITS[k]+' '+MACRO_LABELS[k].toLowerCase());
      if (avg != null) avgParts.push(k === 'calories' ? avg+' kcal' : avg+MACRO_UNITS[k]+' '+MACRO_LABELS[k].toLowerCase());
    });
    if (!totalParts.length) return html + '</div>';

    html += '<div class="macro-readout" style="margin-top:10px;">' +
        '<div><span class="macro-scope">Average serving</span> '+escapeHtml(avgParts.join(' · '))+
          vsTargetChip({ macros:{ calories: avgValues.calories }, servings:1 }, targets)+'</div>' +
        '<div><span class="macro-scope">All '+servingCount+' servings</span> '+escapeHtml(totalParts.join(' · '))+'</div>' +
      '</div>';

    var missing = picked.length - withMacros.length;
    if (missing) html += '<div class="g-meta" style="margin-top:8px;">'+missing+' of these '+(missing===1?'has':'have')+' no macros filled in yet, so the totals are short by that much.</div>';

    if (ui.macroDetailOpen) html += renderMacroTable(picked, totals, servingCount, avgValues, targets);
    return html + '</div>';
  }

  function renderTargetEditor(targets){
    return '<div style="margin-top:10px;padding-top:10px;border-top:1.5px solid var(--line);">' +
      '<p class="muted" style="margin-bottom:2px;">What one serving should roughly come to. Leave anything blank to skip it — it’s only used to show how each meal compares, nothing is enforced.</p>' +
      '<div class="target-grid">' +
        MACRO_KEYS.map(function(k){
          return '<div><label class="field-label" for="target-'+k+'">'+MACRO_LABELS[k]+' ('+MACRO_UNITS[k]+')</label>' +
            '<input type="number" min="0" step="any" id="target-'+k+'" value="'+escapeHtml(targets[k] == null ? '' : targets[k])+'"></div>';
        }).join('') +
      '</div>' +
      '<div class="row-actions" style="margin-top:10px;">' +
        '<button type="button" class="btn btn-primary btn-sm" data-action="saveMacroTargets"'+(ui.targetsSaving?' disabled':'')+'>'+(ui.targetsSaving?'Saving…':'Save target')+'</button>' +
        (hasTargets(weekTargets()) ? '<button type="button" class="btn-link" data-action="clearMacroTargets">Clear it</button>' : '') +
      '</div></div>';
  }

  // Per-meal breakdown. Every column is stated per serving except the last, so
  // a 2-serving curry and a 6-serving traybake are compared on equal terms
  // before the batch column explains why the week total leans the way it does.
  function renderMacroTable(picked, totals, servingCount, avgValues, targets){
    var showTarget = targets.calories !== '';
    var rows = picked.map(function(m){
      var servings = parseFloat(m.servings) || 4;
      if (!hasMacros(m)){
        return '<tr class="no-macros"><td>'+escapeHtml(m.name)+'</td>' +
          '<td class="num">'+servings+'</td>' +
          '<td class="num" colspan="'+(showTarget?6:5)+'">not filled in' +
          (canEstimateMacros(m) ? ' — <button type="button" class="btn-link" data-action="estimateMacros" data-id="'+m.id+'"'+(ui.macroEstimating===m.id?' disabled':'')+'>'+(ui.macroEstimating===m.id?'estimating…':'estimate')+'</button>' : '') +
          '</td></tr>';
      }
      var cells = MACRO_KEYS.map(function(k){
        var v = macroPerServing(m, k);
        return '<td class="num">'+(v == null ? '—' : v + (k === 'calories' ? '' : 'g'))+'</td>';
      }).join('');
      var kcalTotal = macroTotal(m, 'calories');
      var pct = (showTarget && macroPerServing(m,'calories') != null)
        ? Math.round((macroPerServing(m,'calories') / targets.calories) * 100) + '%'
        : '—';
      return '<tr><td>'+escapeHtml(m.name)+'</td>' +
        '<td class="num">'+servings+'</td>' + cells +
        (showTarget ? '<td class="num">'+pct+'</td>' : '') +
        '<td class="num">'+(kcalTotal == null ? '—' : kcalTotal+' kcal')+'</td></tr>';
    }).join('');

    return '<div class="table-scroll"><table class="macro-table">' +
      '<thead><tr><th>Meal</th><th class="num">Servings</th>' +
        MACRO_KEYS.map(function(k){ return '<th class="num">'+MACRO_LABELS[k]+'</th>'; }).join('') +
        (showTarget ? '<th class="num">vs target</th>' : '') +
        '<th class="num">Whole batch</th></tr></thead>' +
      '<tbody>'+rows+'</tbody>' +
      '<tfoot><tr><td>Week</td><td class="num">'+servingCount+'</td>' +
        MACRO_KEYS.map(function(k){
          var v = avgValues[k];
          return '<td class="num">'+(v == null ? '—' : v + (k === 'calories' ? '' : 'g'))+'</td>';
        }).join('') +
        (showTarget ? '<td class="num">—</td>' : '') +
        '<td class="num">'+(totals.calories == null ? '—' : Math.round(totals.calories*10)/10+' kcal')+'</td></tr></tfoot>' +
      '</table>' +
      '<p class="muted" style="margin-top:8px;font-size:0.76rem;">Macro columns are per serving; the week row is the average serving across all '+servingCount+' of them.</p>' +
      '</div>';
  }

  // The key deliberately leaves out which list the row is in. It used to include
  // it, so marking something as a pantry staple moved the row from "to buy" to
  // "check the cupboard" and silently lost the tick you'd already made on it.
  function groceryKey(section, itemName){
    return section + '|' + String(itemName || '').toLowerCase();
  }
  function isGroceryChecked(checked, key){
    return !!(checked[key] || checked['buy|' + key] || checked['cupboard|' + key]);
  }
  function renderGroceryRow(item, section, checked){
    var key = groceryKey(section, item.item);
    var isChecked = isGroceryChecked(checked, key);
    return '<div class="g-item'+(isChecked?' checked':'')+'">' +
      '<label class="g-tick">' +
        '<input type="checkbox" data-action="toggleGroceryItem" data-id="'+encodeURIComponent(key)+'"'+(isChecked?' checked':'')+'>' +
        '<div class="g-body">' +
          '<div class="g-line">' +
            '<span class="g-name">'+escapeHtml(item.item)+
              (item.inPantry ? ' <span class="chip in-pantry">In pantry</span>' : '')+'</span>' +
            '<span class="g-total mono">'+escapeHtml(formatQty(item))+'</span>' +
          '</div>' +
          renderMealsLine(item) +
          (item.mergedFrom && item.mergedFrom.length
            ? '<div class="g-meta">Also listed as '+escapeHtml(item.mergedFrom.join(', '))+'</div>' : '') +
          (item.flag ? '<div class="g-flag">'+escapeHtml(flagLabel(item.flag))+(item.substitute? ' — '+escapeHtml(item.substitute) : ' — no solid substitute, decide in the shop')+'</div>'
            : (item.substitute ? '<div class="g-meta">Note: '+escapeHtml(item.substitute)+'</div>' : '')) +
        '</div>' +
      '</label>' +
      '<div class="g-actions">' +
        (item.extra
          ? '<button type="button" class="btn-link have-it-btn" data-action="removeBuyItem" data-id="'+encodeURIComponent(item.item)+'">Take it off the list</button>'
          : (item.inPantry
            ? '<div class="g-meta pantry-note">Covered by “'+escapeHtml(item.pantryMatch || item.item)+'” in your pantry' +
              ' <button type="button" class="btn-link" data-action="unmatchPantryItem" data-id="'+encodeURIComponent(item.item)+'">not really</button></div>'
            : '<button type="button" class="btn-link have-it-btn" data-action="addGroceryItemToPantry" data-id="'+encodeURIComponent(item.item)+'">I already have this</button>')) +
      '</div></div>';
  }

  // Which meals the grocery list is currently showing. A filter naming a meal
  // that's since left the week is ignored rather than emptying the list.
  function groceryFilterMeal(picked){
    if (!ui.groceryMealFilter) return null;
    return picked.filter(function(m){ return m.id === ui.groceryMealFilter; })[0] || null;
  }

  function renderGroceryFilter(picked, only){
    if (picked.length < 2 && !only) return '';
    var html = '<div class="g-filter"><span class="g-filter-label">Show</span>' +
      '<button type="button" class="g-chip'+(only?'':' on')+'" data-action="setGroceryMeal" data-id="">Everything</button>';
    picked.forEach(function(m){
      var active = only && only.id === m.id;
      var cov = pantryCoverage(m);
      var missing = cov.total - cov.covered;
      html += '<button type="button" class="g-chip'+(active?' on':'')+'" data-action="setGroceryMeal" data-id="'+m.id+'">' +
        escapeHtml(m.name) +
        (cov.total ? '<span class="g-chip-count">'+missing+'</span>' : '') +
      '</button>';
    });
    html += '</div>';

    if (only){
      var c = pantryCoverage(only);
      html += '<div class="warnbox info g-filter-note" style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;">' +
        '<span><strong>'+escapeHtml(only.name)+'</strong> on its own &mdash; ' +
          (c.total
            ? (c.total - c.covered) + ' of ' + c.total + ' ingredient' + (c.total===1?'':'s') + ' still to buy, ' + c.covered + ' already in the pantry (' + c.pct + '% covered).'
            : 'no ingredients listed for this one yet.') +
        '</span>' +
        '<button type="button" class="btn-link" data-action="setGroceryMeal" data-id="">Back to the whole week</button>' +
      '</div>';
    } else if (picked.length > 1){
      html += '<p class="muted" style="margin:-6px 0 12px;">Combined across all '+picked.length+' meals. Tap one to see just what it needs.</p>';
    }
    return html;
  }

  function renderGrocerySection(picked){
    var only = groceryFilterMeal(picked);
    var shown = only ? [only] : picked;
    // Rebuilt from just that meal, not filtered out of the combined list: the
    // headline amount then reads as what THIS recipe needs, rather than a total
    // that quietly includes three other dinners.
    var bySection = buildGroceryList(shown);
    var checked = (weekDoc && weekDoc.checkedItems) || {};
    var html = '<div class="section-head" id="grocery-list"><h2>Grocery list</h2>' +
      '<div class="row-actions">' +
        (!sampleUnavailable
          ? '<button class="btn btn-navy btn-sm" data-action="checkPantryWithAi"'+(ui.pantryChecking?' disabled':'')+'>'+(ui.pantryChecking?'Tidying…':'Tidy list with AI')+'</button>'
          : '') +
        '<button class="btn btn-forest btn-sm" data-action="copyGrocery" data-id="buy">'+(only?'Copy this meal’s list':'Copy buy list')+'</button>' +
        '<button class="btn btn-ghost btn-sm" data-action="copyGrocery" data-id="cupboard">Copy cupboard-check</button>' +
      '</div></div>';

    html += '<p class="muted" style="margin:-6px 0 12px;">Amounts are scaled so every meal makes 4 portions, whatever the recipe says it serves. Ticked items are left out when you copy.</p>';
    html += renderGroceryFilter(picked, only);

    if (ui.pantryCheckNote) html += '<div class="warnbox info">'+escapeHtml(ui.pantryCheckNote)+'</div>';

    if (ui.copyFallbackText){
      html += '<div class="card copy-fallback"><div class="muted">Copy didn’t work automatically &mdash; select the text below and copy it manually.</div>' +
        '<textarea readonly onclick="this.select()">'+escapeHtml(ui.copyFallbackText)+'</textarea></div>';
    }

    var hasBuy = false, hasCupboard = false;
    SECTIONS.forEach(function(s){ bySection[s].forEach(function(i){ if (i.pantryStaple) hasCupboard = true; else hasBuy = true; }); });

    html += '<div class="card"><h3 style="margin-bottom:10px;">To buy</h3>';
    if (!hasBuy) html += '<div class="muted">'+(only ? 'Nothing to buy for this one &mdash; it’s all in the cupboard already.' : 'Nothing to buy &mdash; everything’s a pantry check.')+'</div>';
    SECTIONS.forEach(function(s){
      var items = bySection[s].filter(function(i){ return !i.pantryStaple; });
      if (!items.length) return;
      html += '<div class="g-section"><h3>'+SECTION_LABELS[s]+'</h3>';
      items.forEach(function(item){ html += renderGroceryRow(item, s, checked); });
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="card" style="margin-top:14px;"><h3 style="margin-bottom:10px;">Check the cupboard first</h3>';
    if (!hasCupboard) html += '<div class="muted">Nothing to check &mdash; add staples on the Pantry tab and they’ll land here instead of the buy list.</div>';
    SECTIONS.forEach(function(s){
      var items = bySection[s].filter(function(i){ return i.pantryStaple; });
      if (!items.length) return;
      html += '<div class="g-section"><h3>'+SECTION_LABELS[s]+'</h3>';
      items.forEach(function(item){ html += renderGroceryRow(item, s, checked); });
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  // ---- Meals tab ----
  function renderMealsTab(){
    var f = ui.mealsFilter;
    var list = meals.slice();
    if (f.tier) list = list.filter(function(m){ return m.tier === f.tier; });
    if (f.search) list = list.filter(function(m){ return (m.name+' '+m.base).toLowerCase().indexOf(f.search.toLowerCase()) !== -1; });
    list.sort(function(a,b){
      if (f.sort === 'effort') return (parseFloat(a.effortMinutes)||0) - (parseFloat(b.effortMinutes)||0);
      if (f.sort === 'tier') return TIERS.indexOf(a.tier) - TIERS.indexOf(b.tier);
      if (f.sort === 'lastCooked') return daysSince(a.lastCooked) - daysSince(b.lastCooked);
      return (a.name||'').localeCompare(b.name||'');
    });
    // Whatever's in this week floats to the top, in week-slot order, with the
    // chosen sort still governing everything below it.
    var weekOrder = getWeekIds();
    var inWeekList = [], restList = [];
    list.forEach(function(m){ (weekOrder.indexOf(m.id) !== -1 ? inWeekList : restList).push(m); });
    inWeekList.sort(function(a,b){ return weekOrder.indexOf(a.id) - weekOrder.indexOf(b.id); });
    list = inWeekList.concat(restList);

    var html = '<div class="section-head"><h2>Meals ('+meals.length+')</h2><button class="btn btn-primary btn-sm" data-action="addMeal">+ Add meal</button></div>';
    // Most meals here were added before macros existed, so the useful offer is
    // "fill in the gap for all of them", not "go and do it one by one".
    var missing = mealsMissingMacros();
    if (ui.macroBulk){
      html += '<div class="warnbox info">Estimating macros… '+ui.macroBulk.done+' of '+ui.macroBulk.total+' done.</div>';
    } else if (missing.length && sampleFn && !sampleUnavailable){
      html += '<div class="warnbox info">' +
        '<strong>'+missing.length+' meal'+(missing.length===1?' has':'s have')+' no macros yet.</strong> ' +
        'Open a meal to see them, or estimate the lot from their ingredients. ' +
        '<button type="button" class="btn btn-navy btn-sm" style="margin-top:8px;" data-action="estimateAllMacros">Estimate all '+missing.length+'</button>' +
      '</div>';
    }
    if (ui.macroError && !ui.macroErrorId){
      html += '<div class="warnbox warn">'+escapeHtml(ui.macroError)+'</div>';
    }
    html += '<div class="filters">' +
      '<input type="search" id="meals-search-input" placeholder="Search name or base" value="'+escapeHtml(f.search)+'" data-action="filterSearch">' +
      '<select data-action="filterTier"><option value="">All tiers</option>' + TIERS.map(function(t){ return '<option value="'+t+'"'+(f.tier===t?' selected':'')+'>'+TIER_LABELS[t]+'</option>'; }).join('') + '</select>' +
      '<select data-action="filterSort"><option value="name"'+(f.sort==='name'?' selected':'')+'>Sort: name</option><option value="tier"'+(f.sort==='tier'?' selected':'')+'>Sort: tier</option><option value="effort"'+(f.sort==='effort'?' selected':'')+'>Sort: effort</option><option value="lastCooked"'+(f.sort==='lastCooked'?' selected':'')+'>Sort: last cooked</option></select>' +
    '</div>';

    if (!list.length){
      html += '<div class="empty-state">'+(meals.length ? 'No meals match those filters.' : 'No meals yet — add one or import from a PDF.')+'</div>';
      return html;
    }
    html += '<div class="meal-list">';
    var currentWeekIds = getWeekIds();
    var weekFull = currentWeekIds.indexOf(null) === -1;
    var groupHeadingDone = { week:false, rest:false };
    list.forEach(function(m){
      var rowInWeek = currentWeekIds.indexOf(m.id) !== -1;
      if (rowInWeek && !groupHeadingDone.week){
        groupHeadingDone.week = true;
        html += '<div class="list-divider">In this week</div>';
      } else if (!rowInWeek && !groupHeadingDone.rest && groupHeadingDone.week){
        groupHeadingDone.rest = true;
        html += '<div class="list-divider">Everything else</div>';
      }
      // One meal with an unexpected shape (a bad AI response, a hand-edited
      // record) shouldn't hide every other meal in the list — isolate it here
      // instead of letting it reach the render() top-level boundary.
      try {
        html += renderMealRow(m, currentWeekIds, weekFull);
      } catch(err){
        html += '<div class="meal-row-wrap"><div class="meal-row"><div class="m-info">' +
          '<div class="m-name-btn">'+escapeHtml((m && m.name) || 'A meal')+'</div>' +
          '<div class="g-flag">Couldn’t display this one (' + escapeHtml(err && err.message ? err.message : 'unknown error') + ')</div>' +
          '</div><div class="row-actions">' +
          (m && m.id ? '<button class="btn-link" data-action="askDelete" data-id="'+m.id+'">Delete</button>' : '') +
          '</div></div></div>';
      }
    });
    html += '</div>';
    return html;
  }

  function renderMealRow(m, currentWeekIds, weekFull){
    var expanded = ui.expandedMealId === m.id;
    var inWeek = currentWeekIds.indexOf(m.id) !== -1;
    var html = '<div class="meal-row-wrap"><div class="meal-row"><div class="m-info">' +
      '<button type="button" class="m-name-btn" data-action="toggleMealView" data-id="'+m.id+'">'+escapeHtml(m.name)+'</button>' +
      '<div class="m-meta">' +
        // Ranking straight from the row: it's the edit you make most often, and
        // it shouldn't require opening and saving the whole form. Deliberately a
        // NATIVE select (no appearance:none) so it's obviously a control and
        // opens the system picker on a phone.
        '<span class="rank-label">Rank</span>' +
        '<select class="tier-select" data-action="setMealTier" data-id="'+m.id+'" title="Ranking">' +
          TIERS.map(function(t){ return '<option value="'+t+'"'+((m.tier||'unranked')===t?' selected':'')+'>'+TIER_LABELS[t]+'</option>'; }).join('') +
        '</select>' +
        (m.base ? '<span class="muted">'+escapeHtml(m.base)+'</span>' : '') +
        (m.effort ? '<span class="muted mono">'+escapeHtml(m.effort)+'</span>' : '') +
        (macroPerServing(m,'calories') != null ? '<span class="muted mono">'+macroPerServing(m,'calories')+' kcal/serving</span>' : '') +
        (inWeek ? '<span class="chip in-week">In this week</span>' : '') +
        (m.dietFlags && m.dietFlags.length ? m.dietFlags.map(function(){ return '<span class="chip flag">household rule</span>'; }).slice(0,1).join('') : '') +
      '</div>' +
      (pantry.length ? renderCoverBar(pantryCoverage(m)) : '') +
      '</div>' +
      '<div class="row-actions">';
    if (ui.confirmDeleteId === m.id){
      html += '<span class="muted">Delete for good?</span> <button class="btn-link" data-action="confirmDelete" data-id="'+m.id+'">Yes, delete</button> <button class="btn-link" data-action="cancelDelete" data-id="'+m.id+'">Cancel</button>';
    } else {
      if (inWeek){
        html += '<button class="btn btn-ghost btn-sm" data-action="removeMealFromWeekById" data-id="'+m.id+'">Remove from week</button>';
      } else {
        html += '<button class="btn btn-ghost btn-sm" data-action="addMealToWeek" data-id="'+m.id+'"'+(weekFull?' disabled title="This week is already full"':'')+'>'+(weekFull?'Week full':'+ Add to week')+'</button>';
      }
      html += '<button class="btn btn-ghost btn-sm" data-action="openCook" data-id="'+m.id+'">Cook</button>' +
        '<button class="btn btn-ghost btn-sm" data-action="toggleMealView" data-id="'+m.id+'">'+(expanded?'Hide':'View')+'</button>' +
        '<button class="btn btn-ghost btn-sm" data-action="editMeal" data-id="'+m.id+'">Edit</button>' +
        '<button class="btn-link" data-action="askDelete" data-id="'+m.id+'">Delete</button>';
    }
    html += '</div></div>';
    if (expanded) html += renderMealDetail(m);
    html += '</div>';
    return html;
  }

  function renderMealMacros(m){
    var servings = parseFloat(m.servings) || 4;
    var busy = ui.macroEstimating === m.id || ui.macroBulk;
    var canEstimate = !!sampleFn && !sampleUnavailable && (m.ingredients || []).length > 0;
    var html = '<div class="detail-block"><h4>Macros</h4>';
    if (hasMacros(m)){
      html += '<div class="macro-readout">' +
          '<div><span class="macro-scope">Per serving</span> '+escapeHtml(macroSummary(m,'per'))+'</div>' +
          '<div><span class="macro-scope">All '+servings+' servings</span> '+escapeHtml(macroSummary(m,'total'))+'</div>' +
        '</div>';
      if (m.macrosSource === 'estimate'){
        html += '<div class="g-meta" style="margin-top:8px;">Estimated from the ingredients, not measured — treat it as a ballpark. Edit the meal to correct it.</div>';
      }
      if (canEstimate){
        html += '<div style="margin-top:10px;"><button type="button" class="btn-link" data-action="estimateMacros" data-id="'+m.id+'"'+(busy?' disabled':'')+'>'+(ui.macroEstimating===m.id?'Estimating…':'Re-estimate with AI')+'</button></div>';
      }
    } else {
      html += '<p class="muted">Nothing filled in yet.</p>';
      if (canEstimate){
        html += '<div style="margin-top:8px;"><button type="button" class="btn btn-navy btn-sm" data-action="estimateMacros" data-id="'+m.id+'"'+(busy?' disabled':'')+'>'+(ui.macroEstimating===m.id?'Estimating…':'Estimate with AI')+'</button>' +
          '<span class="muted" style="margin-left:10px;font-size:0.8rem;">or type them in on the edit screen</span></div>';
      } else if (!(m.ingredients || []).length){
        html += '<p class="muted" style="font-size:0.8rem;">Add the ingredients first and they can be estimated from those.</p>';
      } else {
        html += '<p class="muted" style="font-size:0.8rem;">Add them on the edit screen — AI estimating isn’t available in this view.</p>';
      }
    }
    if (ui.macroError && ui.macroErrorId === m.id){
      html += '<div class="warnbox warn" style="margin-top:8px;">'+escapeHtml(ui.macroError)+'</div>';
    }
    return html + '</div>';
  }

  function renderMealDetail(m){
    var html = '<div class="meal-detail">';
    html += '<div class="detail-block"><h4>Method</h4>' +
      (m.method ? '<div class="detail-text">'+escapeHtml(m.method)+'</div>' : '<p class="muted">No method written down yet — edit this meal to add one.</p>') +
      '</div>';
    html += '<div class="detail-block"><h4>Ingredients</h4>';
    if (m.ingredients && m.ingredients.length){
      var cov = pantryCoverage(m);
      if (pantry.length && cov.total){
        html += renderCoverBar(cov) +
          '<div class="g-meta" style="margin:2px 0 8px;">' +
            (cov.missing.length
              ? 'Still to buy: ' + escapeHtml(cov.missing.slice(0,6).join(', ')) + (cov.missing.length > 6 ? ' and '+(cov.missing.length-6)+' more' : '')
              : 'Everything this needs is already in the house.') +
          '</div>';
      }
      html += '<ul class="ing-list">' + m.ingredients.map(function(ing){
        var qty = [ing.quantity, ing.unit].filter(Boolean).join(' ');
        var inPantry = isCoveredByPantry(ing.item);
        return '<li'+(inPantry?' class="covered"':'')+'>' +
          '<span>'+escapeHtml(ing.item||'')+(qty ? ' — '+escapeHtml(qty) : '')+'</span>' +
          (inPantry ? '<span class="ing-cover">in pantry</span>' : '') +
          (ing.pantryStaple ? ' <span class="muted">(pantry staple)</span>' : '') +
          (ing.flag ? '<div class="g-flag">'+escapeHtml(flagLabel(ing.flag))+(ing.substitute ? ' — '+escapeHtml(ing.substitute) : '')+'</div>'
            : (ing.substitute ? '<div class="g-meta">Note: '+escapeHtml(ing.substitute)+'</div>' : '')) +
        '</li>';
      }).join('') + '</ul>';
    } else {
      html += '<p class="muted">No ingredients listed yet — edit this meal to add them.</p>';
    }
    html += '</div>';
    // Always rendered, even with nothing filled in: an empty section that says
    // so and offers to estimate is far more useful than no section at all —
    // silence just looks like the app doesn't do macros.
    html += renderMealMacros(m);
    if (m.notes){
      html += '<div class="detail-block"><h4>Notes</h4><div class="detail-text muted">'+escapeHtml(m.notes)+'</div></div>';
    }
    if (m.sourceUrl){
      html += '<div class="detail-block"><a href="'+escapeHtml(m.sourceUrl)+'" target="_blank" rel="noopener noreferrer" class="btn-link">Original source</a></div>';
    }
    html += '</div>';
    return html;
  }

  // ---- History tab ----
  function sortedHistory(){
    return history.slice().sort(function(a,b){
      return (b.archivedAt || 0) - (a.archivedAt || 0) ||
             String(b.weekStart).localeCompare(String(a.weekStart));
    });
  }
  function prettyDay(iso){
    if (!iso) return '';
    var d = new Date(iso + 'T00:00:00');
    if (isNaN(d.getTime())) return iso;
    var DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
  }
  function prettyWeek(iso){
    if (!iso) return 'A week';
    var d = new Date(iso + 'T00:00:00');
    if (isNaN(d.getTime())) return iso;
    var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return 'Week of ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }

  function renderHistoryTab(){
    var list = sortedHistory();
    var html = '<div class="section-head"><h2>History ('+list.length+')</h2></div>';
    html += '<p class="muted" style="margin-bottom:16px;">Every week gets filed here when you start a new one. Names are stored as they were at the time, so renaming or deleting a meal later doesn’t rewrite what you actually ate.</p>';

    if (!list.length){
      return html + '<div class="empty-state">Nothing filed yet. The first week lands here when you hit “Start a new week” on This Week.</div>';
    }

    // A cook count across everything filed answers the question the tiers are
    // really asking: what do we actually keep making?
    var counts = {};
    list.forEach(function(w){
      (w.meals || []).forEach(function(m){
        if (!m.cookedOn) return;
        var key = m.name;
        counts[key] = (counts[key] || 0) + 1;
      });
    });
    var top = Object.keys(counts).sort(function(a,b){ return counts[b] - counts[a] || a.localeCompare(b); }).slice(0,5);
    if (top.length){
      html += '<div class="card" style="margin-bottom:16px;"><h3 style="font-size:0.68rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-soft);margin-bottom:8px;">Most cooked</h3>' +
        '<div class="pantry-grid">' + top.map(function(name){
          return '<span class="pantry-item">'+escapeHtml(name)+' <strong style="margin-left:4px;">&times;'+counts[name]+'</strong></span>';
        }).join('') + '</div></div>';
    }

    list.forEach(function(w){
      var cooked = (w.meals || []).filter(function(m){ return m.cookedOn; }).length;
      html += '<div class="card hist-week">' +
        '<div class="hist-head">' +
          '<div><h3 class="hist-title">'+escapeHtml(prettyWeek(w.weekStart))+'</h3>' +

  // ---- Pantry tab ----
  //
  // A flat wall of chips told you nothing except that you own a lot of things.
  // Grouped by the same shelves the grocery list uses, so the two pages read
  // the same way, with the running-low state that feeds back into shopping.
  function pantryBySection(){
    var by = {};
    SECTIONS.forEach(function(sec){ by[sec] = []; });
    pantry.forEach(function(item){ by[item.section || 'other'].push(item); });
    SECTIONS.forEach(function(sec){
      by[sec].sort(function(a,b){ return a.name.localeCompare(b.name); });
    });
    return by;
  }
  function pantryLowItems(){ return pantry.filter(function(p){ return p.low; }); }

  // ---- Export / import ----
  // Everything the household has built lives in one artifact database. This is
  // the way out: a versioned snapshot that can be pasted back into this app, or
  // read by whatever it's migrated to. schemaVersion is what makes the second
  // of those possible — an importer can tell what shape it's looking at.
  var SCHEMA_VERSION = 1;

  function buildExportPayload(){
    return {
      schemaVersion: SCHEMA_VERSION,
      exportedAt: new Date().toISOString(),
      app: 'meal-planner',
      meals: meals.map(function(m){ return JSON.parse(JSON.stringify(m)); }),
      week: weekDoc ? JSON.parse(JSON.stringify(weekDoc)) : null,
      pantry: pantry.slice(),
      history: history.map(function(h){ return JSON.parse(JSON.stringify(h)); })
    };
  }
  function exportText(){ return JSON.stringify(buildExportPayload(), null, 2); }

  // Reads a pasted export without trusting any of it. Returns { payload, counts }
  // or throws with something a person can act on.
  function parseImportText(text){
    var raw;
    try { raw = JSON.parse(text); }
    catch(e){ throw new Error('That isn’t valid JSON — paste the whole export, including the opening and closing braces.'); }
    if (!raw || typeof raw !== 'object') throw new Error('That JSON isn’t a meal-planner export.');
    if (raw.app && raw.app !== 'meal-planner') throw new Error('That export came from a different app (' + String(raw.app).slice(0,40) + ').');
    if (raw.schemaVersion && raw.schemaVersion > SCHEMA_VERSION){
      throw new Error('That export was written by a newer version of the app (format ' + raw.schemaVersion + ', this one reads ' + SCHEMA_VERSION + '). Update the app first.');
    }
    var payload = {
      meals: Array.isArray(raw.meals) ? raw.meals.map(normalizeMeal) : [],
      week: (raw.week && typeof raw.week === 'object') ? raw.week : null,
      pantry: normalizePantryList(raw.pantry),
      history: Array.isArray(raw.history) ? raw.history.map(normalizeHistoryEntry) : []
    };
    if (!payload.meals.length && !payload.pantry.length && !payload.history.length && !payload.week){
      throw new Error('There’s nothing in that export — no meals, pantry or history.');
    }
    return {
      payload: payload,
      counts: {
        meals: payload.meals.length,
        pantry: payload.pantry.length,
        history: payload.history.length,
        week: payload.week ? 1 : 0
      }
    };
  }

    }

  function syncFormDraftFromDom(){
    var d = ui.formDraft; if (!d) return;
    // These two run on every render while the form is open; if either were ever
    // missing, the assignments below would throw and break the whole form.
    if (!Array.isArray(d.dietFlags)) d.dietFlags = [];
    if (!Array.isArray(d.ingredients)) d.ingredients = [];
    var g = function(id){ var el = document.getElementById(id); return el ? el.value : ''; };
    d.name = g('f-name'); d.base = g('f-base'); d.tier = g('f-tier'); d.effort = g('f-effort');
    d.effortMinutes = g('f-effortMinutes'); d.servings = g('f-servings') || 4;
    d.lastCooked = g('f-lastCooked'); d.timesCooked = g('f-timesCooked') || 0; d.sourceUrl = g('f-sourceUrl');
    d.method = g('f-method'); d.notes = g('f-notes');
    var macros = blankMacros();
    MACRO_KEYS.forEach(function(k){
      var el = document.getElementById('f-macro-'+k);
      if (!el) { macros[k] = (d.macros && d.macros[k] != null) ? d.macros[k] : ''; return; }
      var v = el.value;
      var n = parseFloat(v);
      macros[k] = (v === '' || isNaN(n) || n < 0) ? '' : Math.round(n*10)/10;
    });
    // A number typed by hand outranks an AI estimate, and stops being labelled
    // as one. Anything the AI writes goes through renderFromDraft, so by the
    // time we read the DOM again a difference here can only be a person typing.
    var macrosChanged = MACRO_KEYS.some(function(k){
      return String(macros[k]) !== String((d.macros && d.macros[k] != null) ? d.macros[k] : '');
    });
    if (macrosChanged) d.macrosSource = 'entered';
    d.macros = macros;
    var adjEl = document.getElementById('adjust-instruction');
    if (adjEl) ui.adjustInstruction = adjEl.value;
    document.querySelectorAll('.diet-row').forEach(function(row){
      var i = parseInt(row.getAttribute('data-row-index'),10);
      var rule = row.querySelector('[data-field="rule"]'), sub = row.querySelector('[data-field="substitute"]');
      d.dietFlags[i] = { rule: rule?rule.value:'', substitute: sub?sub.value:'' };

    });

  // Filing the outgoing week has to happen BEFORE the picks are cleared, and the
  // reset has to happen even if filing fails — otherwise a storage hiccup leaves
  // you unable to start a new week at all, which is worse than a missing entry.
  async function archiveAndResetWeek(){
    var entry = buildHistoryEntry();
    var filed = true;
    if (entry){
      try { await saveHistoryEntry(entry); }
      catch(err){ filed = false; }
    }
    await updateWeek({
      weekStart: mondayIso(),
      mealIds: emptySlots(weekSlots()),
      slots: weekSlots(),
      checkedItems: {}, cooked: {}, extraItems: [],
      pantryOverrides: {}, pantryMatches: {},
      started: true
    });
    if (entry && filed){
      var n = entry.meals.filter(function(m){ return m.cookedOn; }).length;
      ui.toast = 'Filed last week — ' + n + ' of ' + entry.meals.length + ' cooked';
      render();
      setTimeout(function(){ ui.toast = null; render(); }, 2600);
    } else if (entry && !filed){
      ui.actionError = 'Started the new week, but couldn’t file the old one to History.';
      render();
    }
  }

    // The same box, but Claude splits and files it. Anything it returns that
    // wasn't in what they typed is dropped: a pantry that quietly grows items
    // nobody bought is worse than one that needs a bit of typing.
    addPantryWithAi: async function(){
      var raw = (ui.pantryInput || '').trim();
      if (!raw || !sampleFn || ui.pantrySortBusy) return;
      ui.pantrySortBusy = true; ui.pantryAddNote = null; render();
      try {
        var result = await sampleFn.json(buildPantrySortPrompt(raw, pantryNames()), 'pantrySort');
        var incoming = normalizePantryList(result && result.items);
        var typed = normalizePantryTerm(raw);
        var next = pantry.slice(), added = 0, ignored = 0, flagged = 0;
        incoming.forEach(function(item){
          var key = normalizePantryTerm(item.name);
          // Every word of the entry has to appear in what they typed. Catches an
          // invented "onions" while still allowing "toms" -> "tinned tomatoes".
          var grounded = key.split(' ').some(function(w){ return w.length > 2 && typed.indexOf(w) !== -1; });
          if (!grounded){ ignored++; return; }
          var existing = next.filter(function(p){ return normalizePantryTerm(p.name) === key; })[0];
          if (existing){
            // Already on the list, but "we're nearly out of oil" is still news.
            // Skipping the whole entry threw that away.
            if (item.low && !existing.low){
              next = next.map(function(p){ return p === existing ? Object.assign({}, p, { low: true }) : p; });
              flagged++;
            }
            return;
          }
          next.push(item);
          added++;
        });
        ui.pantrySortBusy = false;
        if (!added && !flagged){
          ui.pantryAddNote = ignored
            ? 'Nothing added — what came back didn’t match what you typed. Try “Add plain”.'
            : 'Nothing new there — it’s all on the list already.';
          render();
          return;
        }
        ui.pantryInput = '';
        var bits = [];
        if (added) bits.push('Added ' + added + ' item' + (added===1?'':'s') + ', filed by shelf.');
        if (flagged) bits.push('Marked ' + flagged + ' as running low.');
        if (ignored) bits.push('Left out ' + ignored + ' that didn’t match what you typed.');
        ui.pantryAddNote = bits.join(' ');
        await savePantry(next);
        render();
      } catch(e){
        ui.pantrySortBusy = false;
        ui.pantryAddNote = sampleErrorMessage(e) || 'Couldn’t sort that just now — “Add plain” still works.';
        render();
      }
    },

      if (!last) return;
      var text = last.options[parseInt(id, 10)];

    sendAsst: async function(el, id, extra, e){
      if (e && e.preventDefault) e.preventDefault();
      var a = ui.asst;
      if (a.busy || !sampleFn) return;
      var inputEl = document.getElementById('asst-input');
      if (inputEl) a.input = inputEl.value;
      var text = (a.input || '').trim();
      if (!text) return;

      a.messages.push({ role: 'user', text: text });
      a.input = ''; a.busy = true; a.error = null; a.pending = null;
      render();
      scrollAsstToEnd();

      try {
        var result = await sampleFn.json(buildAssistantPrompt(a.messages.slice(0, -1), text), 'assistant');
        a.busy = false;

        var raw = Array.isArray(result && result.actions) ? result.actions : [];
        var valid = [], dropped = 0;
        raw.forEach(function(x){
          var v = validateAction(x);
          if (v) valid.push(v); else dropped++;
        });

        var reply = (result && typeof result.reply === 'string' && result.reply.trim())
          ? result.reply.trim()
          : (valid.length ? 'Here’s what I’d change.' : 'I couldn’t find anything to change there.');
        var question = (result && typeof result.question === 'string' && result.question.trim()) ? result.question.trim() : null;
        var options = (result && Array.isArray(result.options))
          ? result.options.filter(function(o){ return typeof o === 'string' && o.trim(); }).slice(0, 4)
          : [];

        a.messages.push({ role: 'assistant', text: reply, question: question, options: options });

        // A question and a set of changes at the same time is a contradiction —
        // it either knows what you meant or it doesn't. The question wins.
        if (valid.length && !question){
          a.pending = { actions: valid, chosen: {}, dropped: dropped, applying: false };
        } else if (dropped && !question){
          a.messages.push({ role: 'assistant', text: 'I had ' + dropped + ' idea' + (dropped===1?'':'s') +
            ' that didn’t match anything in your list, so I left ' + (dropped===1?'it':'them') + ' out.' });
        }
        render();
        scrollAsstToEnd();
      } catch(err){
        a.busy = false;
        a.error = sampleErrorMessage(err) || 'Something went wrong there — try again.';
        render();
      }
    },

    applyAsst: async function(){
      var p = ui.asst.pending;
      if (!p || p.applying) return;
      var picked = p.actions.filter(function(_, i){ return p.chosen[i] !== false; });
      if (!picked.length) return;
      p.applying = true; render();
      var done = 0, failed = 0;
      for (var i = 0; i < picked.length; i++){
        try { await applyAssistantAction(picked[i]); done++; }
        catch(err){ failed++; }
      }
      ui.asst.pending = null;
      ui.asst.messages.push({ role: 'assistant', text: failed
        ? 'Applied ' + done + ' of ' + picked.length + '. ' + failed + ' didn’t save — the rest went through.'
        : 'Done — ' + done + ' change' + (done===1?'':'s') + ' applied.' });
      render();
      scrollAsstToEnd();

    // Merge is the safe door: it only ever adds. A meal already here — same id —
    // is left exactly as it is, because the copy in front of you is the one
    // you've been editing, and a backup is by definition older.
    applyImportMerge: async function(){
      if (!ui.importDataPreview || ui.importDataSaving) return;
      var p = ui.importDataPreview.payload;
      ui.importDataSaving = true; ui.importDataError = null; render();
      try {
        var haveMeal = {}; meals.forEach(function(m){ haveMeal[m.id] = true; });
        var addedMeals = 0;
        for (var i = 0; i < p.meals.length; i++){
          var m = p.meals[i];
          if (m.id && haveMeal[m.id]) continue;
          await saveMeal(m);
          addedMeals++;
        }
        var addedPantry = 0;
        var nextPantry = pantry.slice();
        p.pantry.forEach(function(item){
          var exists = nextPantry.some(function(x){ return normalizePantryTerm(x.name) === normalizePantryTerm(item.name); });
          if (!exists){ nextPantry.push(item); addedPantry++; }
        });
        if (addedPantry) await savePantry(nextPantry);

        // History has no stable id across stores, so weeks are matched on the
        // week they cover — importing the same backup twice must not double it.
        var haveWeek = {}; history.forEach(function(h){ haveWeek[h.weekStart] = true; });
        var addedHistory = 0;
        for (var j = 0; j < p.history.length; j++){
          var h = p.history[j];
          if (haveWeek[h.weekStart]) continue;
          var copy = JSON.parse(JSON.stringify(h)); delete copy.id;
          await saveHistoryEntry(copy);
          haveWeek[h.weekStart] = true;
          addedHistory++;
        }
        finishImport('Added ' + addedMeals + ' meal' + (addedMeals===1?'':'s') + ', ' +
          addedPantry + ' pantry item' + (addedPantry===1?'':'s') + ' and ' +
          addedHistory + ' week' + (addedHistory===1?'':'s') + '.');

        ui.importDataSaving = false;
        ui.importDataError = 'Stopped partway: ' + ((err && (err.message||err.code)) || 'unknown error') + '. Anything already added is still here — fix the problem and run it again, it skips what it has.';

    checkPantryWithAi: async function(){
      // Runs with an empty pantry too — merging duplicates is worth it on its own.
      if (!sampleFn || ui.pantryChecking) return;
      var picked = selectedMeals();
      var bySection = buildGroceryList(picked);
      var names = [];
      SECTIONS.forEach(function(s){ bySection[s].forEach(function(i){ names.push(i.item); }); });
      if (!names.length) return;

      ui.pantryChecking = true; ui.pantryCheckNote = null; render();
      try {
        var result = await sampleFn.json(buildPantryMatchPrompt(pantryNames(), names), 'pantryMatch');
        var known = {};
        names.forEach(function(n){ known[normalizePantryTerm(n)] = n; });

        // Duplicates -> variant:canonical, so buildGroceryList collapses them.
        var aliases = {}, mergedGroups = 0;
        (Array.isArray(result && result.duplicates) ? result.duplicates : []).forEach(function(g){
          if (!g || !Array.isArray(g.entries)) return;
          var entries = g.entries.filter(function(e){ return e && known[normalizePantryTerm(e)]; });
          if (entries.length < 2) return;
          var canonical = String(g.name || entries[0]).trim();
          if (!canonical) return;
          entries.forEach(function(e){ aliases[normalizePantryTerm(e)] = canonical; });
          mergedGroups++;
        });

        var map = {};
        var overrides = (weekDoc && weekDoc.pantryOverrides) || {};
        var added = 0;
        (Array.isArray(result && result.matches) ? result.matches : []).forEach(function(m){
          if (!m || !m.item || !m.pantry) return;
          var key = normalizePantryTerm(m.item);
          // Never re-assert something they've explicitly waved off.
          if (overrides[key]) return;
          if (!known[key]) return;
          map[key] = String(m.pantry);
          // The merged line is keyed on its canonical name, so carry the match there too.
          if (aliases[key]) map[normalizePantryTerm(aliases[key])] = String(m.pantry);
          if (!matchesLiterally(m.item)) added++;
        });

        ui.pantryChecking = false;
        var bits = [];
        if (mergedGroups) bits.push('Merged '+mergedGroups+' duplicate'+(mergedGroups===1?'':' sets')+'.');
        if (added) bits.push('Matched '+added+' more item'+(added===1?'':'s')+' to your pantry.');
        ui.pantryCheckNote = bits.length
          ? bits.join(' ') + ' Anything wrong, hit “not really” on the line.'
          : 'Nothing to tidy — no duplicates and no extra pantry matches.';
        await updateWeek({ pantryMatches: map, itemAliases: aliases });
        render();
      } catch(e){
        ui.pantryChecking = false;
        ui.pantryCheckNote = sampleErrorMessage(e) || 'Couldn’t check the pantry just now.';
        render();
      }
    },

      ui.importExtracting = true; ui.importError = null; render();
      try {
        var draft = await sampleFn.json(buildExtractionPrompt(ui.importRawText, ui.importSourceUrl), 'extract');
        ui.importExtracting = false;
        resetAdjustState();
        ui.formDraft = draftToMeal(draft, ui.importSourceUrl);
        ui.formOpen = true;
        render();
      } catch(e){
        ui.importExtracting = false;
        ui.importError = sampleErrorMessage(e);
        render();
      }
    },

    adjustWithAi: async function(){
      if (!sampleFn || !ui.formDraft) return;
      var input = document.getElementById('adjust-instruction');
      var instruction = input ? input.value.trim() : '';
      if (!instruction) return;
      syncFormDraftFromDom();
      ui.adjustInstruction = instruction;
      ui.adjusting = true; ui.adjustError = null; ui.adjustApplied = false; render();
      try {
        var result = await sampleFn.json(buildAdjustPrompt(ui.formDraft, instruction), 'adjust');
        if (result.base) ui.formDraft.base = result.base;
        if (result.method) ui.formDraft.method = result.method;
        // Append rather than replace: notes are where the household records what
        // changed last time, and an adjustment shouldn't wipe something they wrote.
        if (result.notes && String(result.notes).trim()){
          var incoming = String(result.notes).trim();
          var existing = String(ui.formDraft.notes || '').trim();
          if (!existing) ui.formDraft.notes = incoming;
          else if (existing.indexOf(incoming) === -1) ui.formDraft.notes = existing + '\n\n' + incoming;
        }
        if (Array.isArray(result.dietFlags)) ui.formDraft.dietFlags = mapDietFlags(result.dietFlags);
        if (Array.isArray(result.ingredients)) ui.formDraft.ingredients = mapIngredients(result.ingredients);
        if (result.macros){
          if (!ui.formDraft.macros) ui.formDraft.macros = blankMacros();
          var newMacros = normalizeMacros(result.macros);
          // Only overwrite a figure the model actually returned, so an estimate
          // it skipped doesn't wipe one that was filled in by hand.
          ui.formDraft.macrosSource = 'estimate';
          MACRO_KEYS.forEach(function(k){
            if (newMacros[k] !== '') ui.formDraft.macros[k] = newMacros[k];
          });
        }
        ui.adjusting = false;
        ui.adjustInstruction = '';
        ui.adjustApplied = true;
        // Must be renderFromDraft: a plain render() would read the untouched
        // method textarea straight back over what the AI just returned.
        renderFromDraft();
      } catch(e){
        ui.adjusting = false;
        ui.adjustError = sampleErrorMessage(e);
        render();
      }
    },
    manualFromImport: function(){
      resetAdjustState();
      var m = blankMeal();
      m.method = ui.importRawText; m.sourceUrl = ui.importSourceUrl;
      ui.formDraft = m; ui.formOpen = true; render();
    },

    saveMealForm: async function(el, id, extra, e){
      e.preventDefault();
      if (ui.formSaving) return;
      syncFormDraftFromDom();
      var d = ui.formDraft;
      if (!d){ return; }
      // Used to `return` silently here, which looks exactly like a dead Save button.
      if (!d.name || !d.name.trim()){
        ui.formError = 'Give the meal a name before saving.';
        render();
        return;
      }
      (d.ingredients || []).forEach(function(ing){
        if (!ing.flag){ var auto = autoFlagIngredient(ing.item); if (auto){ ing.flag = auto.flag; ing.substitute = ing.substitute || auto.substitute; } }
      });
      ui.formSaving = true; ui.formError = null; render();
      try {
        await saveMeal(d);
        // Marking it cooked in the form is the same claim cook mode makes, so it
        // has to land in the same place — otherwise History disagrees with the
        // meal's own record for no reason the household could ever see.
        if (d.id && d.lastCooked === todayIso() && getWeekIds().indexOf(d.id) !== -1 && weekCookedOn(d.id) !== d.lastCooked){
          var cookedMap = Object.assign({}, weekCookedMap());
          cookedMap[d.id] = d.lastCooked;
          await updateWeek({ cooked: cookedMap });
        }
        ui.formSaving = false;
        resetAdjustState();
        ui.formOpen = false; ui.formDraft = null;
        ui.importRawText = ''; ui.importSourceUrl = ''; ui.importError = null;
        ui.toast = 'Saved';
        render();
        setTimeout(function(){ ui.toast = null; render(); }, 1800);
      } catch(err){
        // Keep the form open with everything still in it — losing the edit AND
        // the explanation is the worst possible outcome here.
        ui.formSaving = false;
        ui.formError = 'Couldn’t save: ' + (err && (err.message || err.code) ? (err.message || err.code) : 'unknown error') + '. Your changes are still here — try again.';
        render();
      }
    }
  };
  function finishImport(message){
    ui.importDataSaving = false;
    ui.importDataPreview = null;
    ui.importDataText = '';
    ui.importDataError = null;
    ui.toast = message;
    render();
    setTimeout(function(){ ui.toast = null; render(); }, 3000);
  }

  var blurActions = {
    autoFlagRow: function(el){
      var row = el.closest('.sub-row'); if (!row) return;
      var flagEl = row.querySelector('[data-field="flag"]');
      if (flagEl && flagEl.value) return;
      var auto = autoFlagIngredient(el.value);
      if (auto && ui.formDraft){
        var i = parseInt(row.getAttribute('data-row-index'),10);
        syncFormDraftFromDom();
        var target = ui.formDraft.ingredients && ui.formDraft.ingredients[i];
        if (!target) return;
        target.flag = auto.flag;
        target.substitute = target.substitute || auto.substitute;
        renderFromDraft();
      }
    }
  };

  // Actions driven by change/input events must NOT also fire on click (the delegated
  // click listener below would otherwise re-run them a second time on the same
  // interaction — double-toggling a checkbox back to its old value, or tearing a
  // text input out of the DOM mid-focus when its container re-renders).
  var CHANGE_ACTIONS = { pdfFile:1, filterTier:1, filterSort:1, weekPickerTier:1, toggleGroceryItem:1, setMealTier:1, linkDraftToggle:1, toggleCookIngredient:1, toggleAsstChange:1 };
  var LIVE_INPUT_ACTIONS = { importTextInput:1, importUrlInput:1, filterSearch:1, weekPickerSearch:1, linkUrlInput:1, pantryInput:1, importDataInput:1, asstInput:1 };

  // Every handler runs through here. A throw inside one used to leave the action
  // half-done with no re-render — the app just stopped responding, with the real
  // error only visible in a console nobody has open on a phone. Now it surfaces.
  function runAction(fn, el, id, e){
    try {
      var result = fn(el, id, null, e);
      if (result && typeof result.catch === 'function') result.catch(reportActionError);
    } catch(err){
      reportActionError(err);
    }
  }
  function reportActionError(err){
    ui.actionError = (err && err.message) ? err.message : String(err);
    try { render(); } catch(e){}
  }

  document.getElementById('app').addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if (!el) return;
    // closest() walks upward, so a click on a plain child (a text field, a label,
    // empty space) can resolve to a CONTAINER that carries an action. Only ever
    // treat a real control as clicked.
    var tag = el.tagName;
    if (tag !== 'BUTTON' && tag !== 'A') return;
    var action = el.getAttribute('data-action');
    if (!actions[action] || CHANGE_ACTIONS[action] || LIVE_INPUT_ACTIONS[action]) return;
    runAction(actions[action], el, el.getAttribute('data-id'), e);
  });
  document.getElementById('app').addEventListener('change', function(e){
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    if (CHANGE_ACTIONS[action] && actions[action]) runAction(actions[action], el, el.getAttribute('data-id'), e);
  });
  document.getElementById('app').addEventListener('input', function(e){
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    if (LIVE_INPUT_ACTIONS[action] && actions[action]) runAction(actions[action], el, el.getAttribute('data-id'), e);
  });
  document.getElementById('app').addEventListener('blur', function(e){
    var el = e.target.closest('[data-action-blur]');
    if (!el) return;
    var action = el.getAttribute('data-action-blur');
    if (blurActions[action]) runAction(blurActions[action], el, null, e);
  }, true);
  document.getElementById('app').addEventListener('submit', function(e){
    var el = e.target.closest('[data-submit-action]');
    if (!el) return;
    // Always stop the native submit first. If the handler below were missing or
    // threw before its own preventDefault, the browser would navigate the frame
    // away from the app — indistinguishable from a crash.
    e.preventDefault();
    var action = el.getAttribute('data-submit-action');
    if (actions[action]) runAction(actions[action], el, null, e);
  });
  // Backdrop dismissal requires the press AND the release to both land on the
  // backdrop itself. Closing on mousedown alone meant a drag that started inside
  // the sheet — or a stray touch during a re-render — could throw away an edit
  // in progress.
  var backdropPressTarget = null;
  document.getElementById('app').addEventListener('mousedown', function(e){
    backdropPressTarget = (e.target && e.target.id) ? e.target.id : null;
  });
  document.getElementById('app').addEventListener('click', function(e){
    var id = e.target && e.target.id;
    if (!id || id !== backdropPressTarget) return;
    if (id === 'form-overlay') runAction(actions.closeForm, e.target, null, e);
    if (id === 'cook-overlay') runAction(actions.closeCook, e.target, null, e);
    if (id === 'week-picker-overlay') runAction(actions.closeWeekPicker, e.target, null, e);
  });

  render();
  initStore();
})();
</script>
