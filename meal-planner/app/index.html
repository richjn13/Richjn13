<title>Meal Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<style>
  /* Deliberately a single light world: white ground everywhere, no dark variant,
     so the app looks the same whatever the phone's system theme is set to.
     Olive is the structural/brand colour, terracotta is action, navy is
     information. Semantic red stays distinct from terracotta so an allergen
     warning never reads as a button. */
  :root{
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --card-2: #FFFFFF;
    --ink: #14191A;
    --ink-soft: #5E6A63;
    --line: #E3E7E2;
    --line-strong: #C7CFC8;
    --olive: #3F5730;
    --olive-ink: #FFFFFF;
    --olive-tint: #EBF0E5;
    --terracotta: #B4522F;
    --terracotta-ink: #FFFFFF;
    --terracotta-tint: #FAE8E1;
    --navy: #1D3A66;
    --navy-ink: #FFFFFF;
    --navy-tint: #E6ECF5;
    --danger: #A81F16;
    --neutral-tint: #F1F2F0;
    --shadow-lift: 0 12px 34px -14px rgba(20,25,26,0.34);
    --accent: var(--terracotta);
    --accent-ink: var(--terracotta-ink);
    --forest: var(--olive);
    --forest-ink: var(--olive-ink);
  }

  *{box-sizing:border-box;}
  body{ background:var(--paper); color:var(--ink);
    font-family:"Archivo", ui-sans-serif, system-ui, sans-serif; font-weight:500; line-height:1.5;
    -webkit-font-smoothing:antialiased; }
  h1,h2,h3,h4{ text-wrap:balance; margin:0; font-family:"Archivo", ui-sans-serif, system-ui, sans-serif;
    font-weight:800; letter-spacing:-0.02em; }
  .mono{ font-family:"JetBrains Mono", ui-monospace, monospace; letter-spacing:0.01em; font-weight:600; }
  .wrap{ max-width:1020px; margin:0 auto; padding:26px 18px 88px; }
  a{color:var(--navy); font-weight:700;}
  button, input, select, textarea{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--terracotta); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

  .topbar{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-bottom:14px; }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand h1{ font-size:1.75rem; font-weight:900; color:var(--olive); letter-spacing:-0.035em; }
  .brand .tag{font-size:0.62rem; text-transform:uppercase; letter-spacing:0.14em; font-weight:700; color:var(--ink-soft);}

  .tabs{ display:flex; gap:2px; margin-bottom:22px; border-bottom:2px solid var(--line); overflow-x:auto; }
  .tab{ background:none; border:none; padding:9px 14px; font-size:0.9rem; font-weight:800; color:var(--ink-soft);
    cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; white-space:nowrap; letter-spacing:-0.01em; }
  .tab.active{ color:var(--terracotta); border-bottom-color:var(--terracotta); }
  .tab:hover{ color:var(--ink); }
  .tab.active:hover{ color:var(--terracotta); }

  /* Phone. Six tabs do not fit on 390px and a horizontally scrolling strip with
     no affordance means the last one may as well not exist, so they wrap. The
     tagline is decoration and goes; the title stops taking two lines. */
  @media (max-width:560px){
    .wrap{ padding:18px 14px 96px; }
    .brand h1{ font-size:1.45rem; }
    .brand .tag{ display:none; }
    .tabs{ flex-wrap:wrap; overflow-x:visible; row-gap:0; }
    .tab{ padding:9px 11px; font-size:0.86rem; }
    .section-head h2{ font-size:1.15rem; }
    /* Header actions read as a row of equals rather than a ragged stack. */
    .section-head .row-actions .btn-sm{ flex:1 1 auto; text-align:center; }
    /* A labelled pill is a lot of screen to give a floating button when it sits
       over the content you are reading. On a phone it is just the mark. */
    .asst-bubble{ padding:0; width:56px; height:56px; justify-content:center; right:14px; }
    .asst-bubble-text{ display:none; }
    .asst-bubble-icon{ font-size:1.3rem; }
  }

  .card{ background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:20px; }
  .hero{ text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px; padding:52px 28px; }
  .hero h2{ font-size:2rem; font-weight:900; max-width:22ch; letter-spacing:-0.035em; }
  .hero p{max-width:48ch; color:var(--ink-soft); font-size:0.95rem;}
  .eyebrow{ font-size:0.64rem; text-transform:uppercase; letter-spacing:0.16em; color:var(--olive); font-weight:800; }

  .btn{ border:2px solid transparent; border-radius:10px; padding:10px 18px; font-size:0.88rem; font-weight:800;
    letter-spacing:-0.01em; cursor:pointer; }
  .btn-primary{ background:var(--terracotta); color:var(--terracotta-ink); }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-forest{ background:var(--olive); color:var(--olive-ink); }
  .btn-forest:hover{ filter:brightness(1.12); }
  .btn-navy{ background:var(--navy); color:var(--navy-ink); }
  .btn-ghost{ background:var(--card); border-color:var(--line-strong); color:var(--ink); }
  .btn-ghost:hover{ border-color:var(--olive); color:var(--olive); }
  .btn-danger{ background:var(--card); border-color:var(--danger); color:var(--danger); }
  .btn-sm{ padding:6px 12px; font-size:0.78rem; border-radius:8px; }
  .btn-link{ background:none; border:none; color:var(--navy); text-decoration:underline; text-underline-offset:2px;
    cursor:pointer; padding:0; font-size:0.8rem; font-weight:700; }
  .btn-link:hover{ color:var(--terracotta); }
  .btn[disabled]{ opacity:0.4; cursor:default; }
  .row-actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

  .section-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .section-head h2{font-size:1.3rem; font-weight:900; letter-spacing:-0.03em;}
  .muted{ color:var(--ink-soft); font-size:0.85rem; font-weight:500; }

  .chip{ font-size:0.62rem; text-transform:uppercase; letter-spacing:0.06em; padding:3px 9px; border-radius:999px;
    font-weight:800; white-space:nowrap; }
  .chip.tier-often{ background:var(--olive-tint); color:var(--olive); }
  .chip.tier-sometimes{ background:var(--navy-tint); color:var(--navy); }
  .chip.tier-rarely{ background:var(--terracotta-tint); color:var(--terracotta); }
  .chip.tier-unranked{ background:var(--neutral-tint); color:var(--ink-soft); }
  .chip.flag{ background:var(--terracotta-tint); color:var(--terracotta); }
  .chip.in-week{ background:var(--olive-tint); color:var(--olive); }
  .chip.in-pantry{ background:var(--navy-tint); color:var(--navy); }
  .rank-label{ font-size:0.58rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--ink-soft); font-weight:800; }
  .tier-select{ font-size:0.74rem; font-weight:700; border:1.5px solid var(--line-strong); border-radius:7px;
    padding:3px 5px; background:var(--card); color:var(--ink); cursor:pointer; max-width:130px; }
  .tier-select:hover, .tier-select:focus{ border-color:var(--olive); }

  /* meals list */
  .filters{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .filters select, .filters input[type="search"]{ border:1.5px solid var(--line-strong); background:var(--card);
    color:var(--ink); border-radius:9px; padding:8px 11px; font-size:0.82rem; font-weight:600; }
  .meal-list{ display:flex; flex-direction:column; gap:10px; }
  .list-divider{ font-size:0.64rem; text-transform:uppercase; letter-spacing:0.14em; font-weight:800;
    color:var(--ink-soft); padding-top:6px; }
  .list-divider:first-child{ padding-top:0; }
  .meal-row-wrap{ display:flex; flex-direction:column; gap:8px; }
  .meal-row{ background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:14px 16px;
    display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .meal-row:hover{ border-color:var(--line-strong); }
  .meal-row .m-name-btn{ background:none; border:none; padding:0; cursor:pointer; text-align:left; color:var(--ink);
    font-weight:800; font-size:1.05rem; letter-spacing:-0.02em; }
  .meal-row .m-name-btn:hover{ color:var(--terracotta); }
  .meal-row .m-meta{ display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin-top:6px; }
  .meal-row .m-info{ flex:1; min-width:200px; }
  .empty-state{ text-align:center; padding:44px 20px; color:var(--ink-soft); }
  .meal-detail{ background:var(--card); border:1.5px solid var(--line-strong); border-radius:12px; padding:16px 18px; }
  .detail-block{ margin-bottom:14px; }
  .detail-block:last-child{ margin-bottom:0; }
  .detail-block h4{ font-size:0.64rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-soft); margin-bottom:6px; font-weight:800; }
  .detail-text{ white-space:pre-wrap; font-size:0.9rem; }
  .ing-list{ margin:0; padding-left:18px; font-size:0.9rem; }
  .ing-list li{ margin-bottom:6px; }

  /* pantry */
  .pantry-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .pantry-item{ display:inline-flex; align-items:center; background:var(--olive-tint); color:var(--olive);
    border-radius:999px; font-size:0.84rem; font-weight:700; overflow:hidden;
    border:1.5px solid transparent; transition:border-color 0.12s ease, background 0.12s ease; }
  .pantry-item:hover{ border-color:var(--olive); }
  .pantry-name{ background:none; border:none; color:inherit; font:inherit; cursor:pointer;
    padding:7px 4px 7px 14px; display:inline-flex; align-items:center; gap:6px; }
  .pantry-item.low{ background:var(--terracotta-tint); color:var(--terracotta); }
  .pantry-item.low:hover{ border-color:var(--terracotta); }
  .pantry-low-tag{ font-size:0.58rem; text-transform:uppercase; letter-spacing:0.1em; font-weight:800;
    background:var(--terracotta); color:var(--terracotta-ink); border-radius:999px; padding:2px 6px; }
  .pantry-remove{ background:none; border:none; color:inherit; cursor:pointer; font-size:1.05rem; line-height:1;
    padding:7px 12px 7px 6px; opacity:0.55; }
  .pantry-remove:hover{ opacity:1; color:var(--terracotta); }
  /* the shelf heading carries its own count, right-aligned like the grocery list */
  .g-section h3 .muted{ font-size:0.68rem; font-weight:800; }

  .have-it-btn{ font-size:0.78rem; }

  /* form */
  .field{ margin-bottom:14px; }
  .field label, .field-label{ display:block; font-size:0.64rem; text-transform:uppercase; letter-spacing:0.12em;
    color:var(--ink-soft); font-weight:800; margin-bottom:5px; }
  .field input[type="text"], .field input[type="number"], .field input[type="date"], .field input[type="url"], .field select, .field textarea{
    width:100%; border:1.5px solid var(--line-strong); background:var(--card); color:var(--ink); border-radius:9px;
    padding:10px 11px; font-size:0.9rem; font-weight:600;
  }
  .field textarea{ min-height:96px; resize:vertical; line-height:1.55; font-weight:500; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:640px){ .grid-2{ grid-template-columns:1fr; } }
  fieldset{ border:1.5px solid var(--line); border-radius:12px; padding:16px; margin:0 0 18px; }
  legend{ font-size:0.64rem; text-transform:uppercase; letter-spacing:0.12em; font-weight:800; color:var(--ink-soft); padding:0 6px; }
  .sub-row{ display:grid; grid-template-columns: 1.4fr 0.7fr 0.7fr 1fr auto 1fr auto; gap:6px; align-items:center; margin-bottom:8px; }
  .sub-row input, .sub-row select{ border:1.5px solid var(--line-strong); background:var(--card); color:var(--ink);
    border-radius:7px; padding:7px 8px; font-size:0.8rem; width:100%; font-weight:600; }
  @media (max-width:800px){ .sub-row{ grid-template-columns:1fr 1fr; } }
  .diet-row{ display:grid; grid-template-columns:1fr 1fr auto; gap:6px; margin-bottom:8px; }
  .diet-row input{ border:1.5px solid var(--line-strong); background:var(--card); color:var(--ink); border-radius:7px;
    padding:7px 8px; font-size:0.8rem; font-weight:600; }
  .form-actions{ display:flex; justify-content:space-between; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .macro-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  @media (max-width:560px){ .macro-grid{ grid-template-columns:repeat(2,1fr); } }
  .macro-total{ margin-top:10px; font-size:0.8rem; color:var(--ink-soft); font-weight:600; }
  .macro-readout{ display:flex; flex-direction:column; gap:5px; font-size:0.88rem; font-weight:600; }
  .macro-scope{ display:inline-block; min-width:8.5em; font-size:0.62rem; text-transform:uppercase;
    letter-spacing:0.1em; color:var(--ink-soft); font-weight:800; }
  .macro-week{ margin-bottom:16px; }
  .macro-table{ width:100%; border-collapse:collapse; font-size:0.82rem; margin-top:10px; }
  .macro-table th{ text-align:left; font-size:0.58rem; text-transform:uppercase; letter-spacing:0.1em;
    color:var(--ink-soft); font-weight:800; padding:0 8px 6px 0; border-bottom:1.5px solid var(--line); }
  .macro-table td{ padding:7px 8px 7px 0; border-bottom:1px solid var(--line); font-weight:600;
    font-variant-numeric:tabular-nums; }
  .macro-table td:first-child, .macro-table th:first-child{ font-weight:700; }
  .macro-table .num{ text-align:right; white-space:nowrap; }
  .macro-table tr.no-macros td{ color:var(--ink-soft); font-weight:500; }
  .macro-table tfoot td{ border-bottom:none; border-top:1.5px solid var(--line-strong); font-weight:800; }
  .table-scroll{ overflow-x:auto; }
  .target-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:8px; }
  @media (max-width:560px){ .target-grid{ grid-template-columns:repeat(2,1fr); } }
  .target-grid input{ width:100%; border:1.5px solid var(--line-strong); background:var(--card); color:var(--ink);
    border-radius:8px; padding:8px 9px; font-size:0.85rem; font-weight:600; }
  .vs-target{ font-size:0.72rem; font-weight:800; padding:2px 7px; border-radius:999px; margin-left:8px;
    white-space:nowrap; background:var(--neutral-tint); color:var(--ink-soft); }
  .vs-target.over{ background:var(--terracotta-tint); color:var(--terracotta); }
  .vs-target.under{ background:var(--navy-tint); color:var(--navy); }
  .vs-target.on{ background:var(--olive-tint); color:var(--olive); }

  /* cook mode — read at arm's length, with wet hands */
  .cook-overlay{ background:rgba(20,25,20,0.62); align-items:stretch; padding:0; }
  @media (min-width:640px){ .cook-overlay{ align-items:center; padding:20px; } }
  .cook-sheet{ background:var(--card); width:100%; max-width:720px; margin:0 auto; display:flex;
    flex-direction:column; max-height:100vh; height:100vh; }
  @supports (height: 100dvh){ .cook-sheet{ max-height:100dvh; height:100dvh; } }
  @media (min-width:640px){
    .cook-sheet{ height:auto; max-height:90vh; border-radius:18px; box-shadow:var(--shadow-lift); }
    @supports (height: 100dvh){ .cook-sheet{ max-height:90dvh; } }
  }
  .cook-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    padding:18px 20px 14px; border-bottom:1.5px solid var(--line); flex:none; }
  .cook-name{ font-size:1.15rem; font-weight:900; letter-spacing:-0.03em; }
  .cook-progress{ font-size:0.64rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--olive);
    font-weight:800; margin-top:4px; }
  .cook-body{ flex:1; overflow-y:auto; padding:20px; }
  .cook-label{ font-size:0.62rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-soft);
    font-weight:800; margin-bottom:10px; }
  .cook-ing{ list-style:none; margin:0; padding:0; }
  .cook-ing-row{ border-bottom:1px solid var(--line); }
  .cook-ing-row:last-child{ border-bottom:none; }
  /* The whole row is the hit target: tapping a 22px box with oily hands is a
     losing game, so the label wraps everything. */
  .cook-ing-row label{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:13px 2px;
    font-size:1.05rem; font-weight:600; cursor:pointer; }
  .cook-ing-row input[type="checkbox"]{ width:26px; height:26px; flex:none; accent-color:var(--olive); }
  .cook-qty{ min-width:5em; font-weight:800; font-variant-numeric:tabular-nums; color:var(--olive); }
  .cook-ing-name{ flex:1; min-width:0; }
  .cook-ing-row.used label{ color:var(--ink-soft); }
  .cook-ing-row.used .cook-ing-name{ text-decoration:line-through; }
  .cook-ing-row.used .cook-qty{ color:var(--ink-soft); }
  .cook-ing .g-flag{ padding:0 2px 10px 50px; font-size:0.82rem; }
  .cook-step-ing{ margin-top:22px; padding-top:6px; border-top:1.5px solid var(--line); }
  .cook-showall{ margin-top:16px; align-self:flex-start; }
  .cook-step-body{ display:flex; flex-direction:column; gap:16px; justify-content:flex-start; padding-top:28px; }
  .cook-step-num{ font-size:1rem; font-weight:900; color:var(--olive-ink); background:var(--olive);
    border-radius:999px; width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    flex:none; font-variant-numeric:tabular-nums; }
  .cook-step-text{ font-size:1.45rem; line-height:1.45; font-weight:600; text-wrap:pretty; }
  @media (max-width:520px){ .cook-step-text{ font-size:1.25rem; } }
  .cook-foot{ display:flex; gap:10px; padding:14px 20px calc(16px + env(safe-area-inset-bottom));
    border-top:1.5px solid var(--line); flex:none; }
  .cook-nav{ flex:1; padding:16px 18px; font-size:1rem; }
  .chip.cooked{ background:var(--olive); color:var(--olive-ink); }

  /* history */
  .hist-week{ margin-bottom:12px; }
  .hist-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    flex-wrap:wrap; margin-bottom:10px; }
  .hist-title{ font-size:1.02rem; font-weight:800; letter-spacing:-0.02em; }
  .hist-list{ list-style:none; margin:0; padding:0; }
  .hist-item{ display:flex; align-items:baseline; gap:10px; padding:8px 0; border-bottom:1px solid var(--line);
    font-size:0.9rem; }
  .hist-item:last-child{ border-bottom:none; }
  .hist-mark{ flex:none; width:1.2em; text-align:center; font-weight:900; color:var(--line-strong); }
  .hist-item.cooked .hist-mark{ color:var(--olive); }
  .hist-name{ flex:1; font-weight:700; text-align:left; font-size:0.9rem; }
  .hist-item.cooked .hist-name{ color:var(--ink); }
  .hist-when{ flex:none; font-size:0.76rem; font-variant-numeric:tabular-nums; }

  /* grocery: filter by meal */
  .g-filter{ display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-bottom:12px; }
  .g-filter-label{ font-size:0.58rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-soft);
    font-weight:800; margin-right:2px; }
  .g-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--card); border:1.5px solid var(--line-strong);
    color:var(--ink); border-radius:999px; padding:6px 12px; font-size:0.8rem; font-weight:700; cursor:pointer; }
  .g-chip:hover{ border-color:var(--olive); color:var(--olive); }
  .g-chip.on{ background:var(--olive); border-color:var(--olive); color:var(--olive-ink); }
  .g-chip-count{ font-size:0.68rem; font-weight:800; background:var(--neutral-tint); color:var(--ink-soft);
    border-radius:999px; padding:1px 7px; font-variant-numeric:tabular-nums; }
  .g-chip.on .g-chip-count{ background:rgba(255,255,255,0.22); color:var(--olive-ink); }

  /* pantry coverage */
  .cover{ display:flex; align-items:center; gap:8px; margin-top:7px; }
  .cover-bar{ flex:none; width:74px; height:7px; border-radius:999px; background:var(--neutral-tint); overflow:hidden; }
  .cover-fill{ height:100%; background:var(--olive); border-radius:999px; }
  .cover-text{ font-size:0.75rem; color:var(--ink-soft); font-weight:700; }
  .cover-text strong{ color:var(--olive); font-weight:800; }
  .ing-list li.covered > span:first-child{ color:var(--ink); }
  .ing-cover{ font-size:0.62rem; text-transform:uppercase; letter-spacing:0.06em; font-weight:800;
    color:var(--olive); background:var(--olive-tint); border-radius:999px; padding:2px 7px; margin-left:6px; }

  /* inline slot editor on This Week */
  .slot-edit{ background:var(--card); border:1.5px solid var(--line-strong); border-top:none;
    border-radius:0 0 12px 12px; padding:14px 16px 16px; margin-top:-11px; }
  .slot-edit h4{ font-size:0.62rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-soft);
    font-weight:800; margin-bottom:8px; }
  .slot-wrap{ display:flex; flex-direction:column; }
  .slot-wrap.editing .slot{ border-bottom-left-radius:0; border-bottom-right-radius:0; }
  .macro-week h3{ font-size:0.68rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-soft);
    font-weight:800; margin-bottom:8px; }
  .adjust-fieldset{ background:var(--card); border-color:var(--line-strong); }
  .adjust-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .adjust-row input{ flex:1; min-width:200px; border:1.5px solid var(--line-strong); background:var(--card);

<script>
(function(){
  // ---------- constants ----------
  var SECTIONS = ['produce','protein','dairy-and-chilled','tins-and-dry-goods','freezer','other'];

  var TIERS = ['often','sometimes','rarely','unranked'];
  var TIER_LABELS = { often:'Often', sometimes:'Sometimes', rarely:'Rarely', unranked:'Unranked' };

  // to specific culinary substitutes (a whole category of easy-miss ingredients
  // with well-established swaps); everything else below is a specific allergen
  // to avoid, each checked against a short list of keywords likely to appear in
  // an ingredient name. Order matters: more specific/named items are checked
  // before broad categories (cow-milk, gluten) so e.g. "cashew milk" flags as
  // cashew, not cow-milk, and "fresh pasta" flags for egg white before the
  // plain "pasta" gluten check gets to it.
  var FLAG_LABELS = {
    'not-gluten-free': 'Not gluten-free',
    'egg-white': 'Contains egg white',
    'flaxseed': 'Contains flaxseed/linseed',
    'cashew': 'Contains cashew',
    'pistachio': 'Contains pistachio',
    'hazelnut': 'Contains hazelnut',
    'mushroom': 'Contains mushroom',
    'gliadin': 'Contains gliadin',
    'orange': 'Contains orange',
    'cuttlefish': 'Contains cuttlefish',

    { flag: 'cashew', keywords: ['cashew'], substitute: 'swap for sunflower or pumpkin seeds, or omit' },
    { flag: 'pistachio', keywords: ['pistachio'], substitute: 'swap for sunflower or pumpkin seeds, or omit' },
    { flag: 'hazelnut', keywords: ['hazelnut', 'filbert'], substitute: 'swap for sunflower or pumpkin seeds, or omit' },
    { flag: 'mushroom', keywords: ['mushroom', 'mushrooms', 'porcini', 'shiitake', 'portobello', 'cremini'], substitute: 'swap for extra onion/pepper or butter beans for texture, or omit' },
    { flag: 'gliadin', keywords: ['gliadin'], substitute: 'same as gluten-free — check for wheat-derived ingredients' },
    { flag: 'orange', keywords: ['orange', 'oranges'], exclude: ['orange pepper', 'orange bell', 'orange-fleshed', 'orange sweet potato'], substitute: 'swap for lemon or another citrus if tolerated, or omit' },
    { flag: 'cuttlefish', keywords: ['cuttlefish'], substitute: 'no confident substitute — omit or ask' },
    { flag: 'brewers-yeast', keywords: ['brewer’s yeast', 'brewers yeast', "brewer's yeast"], substitute: 'check for hidden sources (some stocks, beers, spreads) — omit if present' },
    { flag: 'lobster', keywords: ['lobster'], substitute: 'no confident substitute — omit or ask' },
    // Egg white family — whole eggs carry the white, so treat "egg"/"eggs" generically as this flag.
    { flag: 'egg-white', keywords: ['egg white', 'egg whites', 'meringue', 'egg wash', 'fresh pasta', 'mayonnaise', 'mayo', 'eggs', 'egg'],
      exclude: ['eggplant', 'egg-free', 'egg free', 'eggless', 'flax egg', 'chia egg', 'vegan mayo'], substitute: 'use aquafaba or a flax egg' },
    // Gluten-free family.
    { flag: 'not-gluten-free', keywords: ['soy sauce'], substitute: 'use tamari' },
    { flag: 'not-gluten-free', keywords: ['stock'], substitute: 'check the label or use a certified gluten-free stock' },
    { flag: 'not-gluten-free', keywords: ['oats'], exclude: ['gluten-free oats', 'gluten free oats'], substitute: 'use certified gluten-free oats' },
    { flag: 'not-gluten-free', keywords: ['gnocchi'], substitute: 'use gluten-free gnocchi' },
    { flag: 'not-gluten-free', keywords: ['pasta', 'noodles'], exclude: ['gluten-free pasta', 'gluten free pasta', 'rice noodles', 'glass noodles'], substitute: 'use gluten-free pasta' },
    { flag: 'not-gluten-free', keywords: ['tortilla', 'tortillas'], exclude: ['corn tortilla'], substitute: 'use corn or gluten-free tortillas' },
    { flag: 'not-gluten-free', keywords: ['breadcrumbs'], substitute: 'use gluten-free breadcrumbs or crushed rice cakes' },
    { flag: 'not-gluten-free', keywords: ['spice blend'], substitute: 'check the label — some blends use wheat as a filler' },
    { flag: 'not-gluten-free', keywords: ['sauce'], exclude: ['tomato sauce', 'apple sauce', 'applesauce', 'cranberry sauce'], substitute: 'check the label — some sauces sneak in wheat' },

        'butternut', 'butter bean', 'butter lettuce', 'peanut butter', 'almond butter', 'cashew butter',
        'sunflower butter', 'seed butter', 'nut butter', 'cocoa butter', 'shea butter', 'apple butter',
        'vegan butter', 'dairy-free butter', 'coconut milk', 'coconut cream', 'coconut yogurt', 'oat milk',
        'almond milk', 'soy milk', 'soya milk', 'rice milk', 'hemp milk', 'cashew milk', 'plant milk',
        'plant-based milk', 'non-dairy', 'dairy-free', 'dairy free', 'cream of tartar', 'vegan cheese',

  function todayIso(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  // whole-batch figure is derived from `servings` so the two can never drift.
  var MACRO_KEYS = ['calories','protein','carbs','fat'];
  var MACRO_LABELS = { calories:'Calories', protein:'Protein', carbs:'Carbs', fat:'Fat' };
  var MACRO_UNITS = { calories:'kcal', protein:'g', carbs:'g', fat:'g' };
