<title>Dinner Docket</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  :root{
    --paper: #F3F5EE;
    --card: #FCFDFA;
    --ink: #1F2A22;
    --ink-soft: #57634F;
    --line: #DAE1CE;
    --accent: #C24A34;
    --accent-ink: #FFF8F3;
    --accent-2: #C98A1F;
    --forest: #2F5233;
    --forest-ink: #EAF1E7;
    --shadow: 0 1px 2px rgba(31,42,34,0.06), 0 8px 24px -12px rgba(31,42,34,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #161B15;
      --card: #1E241C;
      --ink: #ECEFE5;
      --ink-soft: #A5AF9A;
      --line: #333C2E;
      --accent: #E1684E;
      --accent-ink: #241008;
      --accent-2: #E9BE5B;
      --forest: #7CB187;
      --forest-ink: #10190F;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --paper: #161B15;
    --card: #1E241C;
    --ink: #ECEFE5;
    --ink-soft: #A5AF9A;
    --line: #333C2E;
    --accent: #E1684E;
    --accent-ink: #241008;
    --accent-2: #E9BE5B;
    --forest: #7CB187;
    --forest-ink: #10190F;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Archivo", ui-sans-serif, system-ui, sans-serif;
    line-height:1.45;
  }
  h1,h2,h3{
    font-family:"Fraunces", Georgia, serif;
    text-wrap:balance;
    margin:0;
  }
  .mono{
    font-family:"JetBrains Mono", ui-monospace, monospace;
    letter-spacing:0.04em;
  }
  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:28px 20px 72px;
  }
  a{color:inherit;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

  /* header */
  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    padding-bottom:18px;
    margin-bottom:26px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand h1{font-size:1.7rem; font-weight:700; color:var(--forest);}
  .brand .tag{
    font-size:0.68rem;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .who{
    display:flex; align-items:center; gap:10px;
    font-size:0.85rem;
    color:var(--ink-soft);
  }
  .who button{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    border-radius:999px;
    padding:6px 14px;
    font-size:0.8rem;
    cursor:pointer;
  }
  .who button:hover{border-color:var(--accent); color:var(--accent);}

  /* start / hero state */
  .hero{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:52px 40px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .hero .eyebrow{
    font-size:0.72rem;
    text-transform:uppercase;
    color:var(--accent-2);
    font-weight:600;
  }
  .hero h2{font-size:2.1rem; max-width:20ch; color:var(--ink);}
  .hero p{max-width:46ch; color:var(--ink-soft); font-size:0.98rem;}
  .primary-btn{
    margin-top:8px;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    border-radius:12px;
    padding:14px 30px;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 6px 18px -8px rgba(194,74,52,0.55);
  }
  .primary-btn:hover{filter:brightness(1.06);}

  /* board */
  .board-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .board-head h2{font-size:1.5rem;}
  .board-head .range{color:var(--ink-soft); font-size:0.9rem;}
  .ghost-btn{
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    border-radius:10px;
    padding:8px 14px;
    font-size:0.82rem;
    cursor:pointer;
  }
  .ghost-btn:hover{border-color:var(--accent); color:var(--accent);}

  .board{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:12px;
  }
  @media (max-width:960px){ .board{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .board{grid-template-columns:1fr;} }

  .day{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
    min-height:168px;
    box-shadow:var(--shadow);
  }
  .day.today{border-color:var(--accent);}
  .day-label{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .day-name{font-weight:700; font-size:0.95rem;}
  .day-date{font-size:0.72rem; color:var(--ink-soft);}
  .day.today .day-name{color:var(--accent);}

  .slot-empty{
    flex:1;
    border:1.5px dashed var(--line);
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink-soft);
    font-size:0.82rem;
    cursor:pointer;
    background:transparent;
    text-align:center;
    padding:10px;
  }
  .slot-empty:hover{border-color:var(--accent); color:var(--accent);}

  .slot-filled{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:8px;
    justify-content:space-between;
  }
  .meal-name{font-family:"Fraunces", serif; font-weight:600; font-size:1.02rem; text-wrap:balance;}
  .meal-meta{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .chip{
    font-size:0.62rem;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:999px;
    font-weight:600;
  }
  .chip.cat-quick{background:#E4EFD9; color:#3C6B2A;}
  .chip.cat-comfort{background:#F3E1D2; color:#8A4A1E;}
  .chip.cat-healthy{background:#DCEEE9; color:#1F6E5C;}
  .chip.cat-takeout{background:#EAE3F3; color:#5B3B8C;}
  .chip.cat-date{background:#FBE0E6; color:#A62A4C;}
  .chip.cat-leftovers{background:#F2EAD2; color:#7A6412;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .chip.cat-quick{background:#233B1C; color:#B4DE9C;}
    :root:not([data-theme="light"]) .chip.cat-comfort{background:#3B2617; color:#EAB988;}
    :root:not([data-theme="light"]) .chip.cat-healthy{background:#163530; color:#8FD6C4;}
    :root:not([data-theme="light"]) .chip.cat-takeout{background:#2A2140; color:#C6ADEC;}
    :root:not([data-theme="light"]) .chip.cat-date{background:#3A1C24; color:#F0A9BC;}
    :root:not([data-theme="light"]) .chip.cat-leftovers{background:#332B12; color:#E0CE86;}
  }
  :root[data-theme="dark"] .chip.cat-quick{background:#233B1C; color:#B4DE9C;}
  :root[data-theme="dark"] .chip.cat-comfort{background:#3B2617; color:#EAB988;}
  :root[data-theme="dark"] .chip.cat-healthy{background:#163530; color:#8FD6C4;}
  :root[data-theme="dark"] .chip.cat-takeout{background:#2A2140; color:#C6ADEC;}
  :root[data-theme="dark"] .chip.cat-date{background:#3A1C24; color:#F0A9BC;}
  :root[data-theme="dark"] .chip.cat-leftovers{background:#332B12; color:#E0CE86;}

  .time-badge{font-size:0.68rem; color:var(--ink-soft);}
  .meal-foot{display:flex; align-items:center; justify-content:space-between;}
  .picked-by{
    display:flex; align-items:center; gap:6px;
    font-size:0.72rem; color:var(--ink-soft);
  }
  .avatar{
    width:20px; height:20px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:0.62rem; font-weight:700; color:#fff;
    flex:none;
  }
  .swap-btn{
    background:none; border:none; color:var(--ink-soft);
    font-size:0.68rem; text-decoration:underline; cursor:pointer; padding:0;
  }
  .swap-btn:hover{color:var(--accent);}

  /* picker overlay */
  .overlay{
    position:fixed; inset:0;
    background:rgba(20,24,18,0.45);
    display:flex; align-items:flex-end;
    justify-content:center;
    z-index:20;
    padding:0;
  }
  @media (min-width:640px){ .overlay{align-items:center; padding:20px;} }
  .picker{
    background:var(--card);
    width:100%;
    max-width:560px;
    max-height:88vh;
    overflow-y:auto;
    border-radius:18px 18px 0 0;
    padding:22px 22px 28px;
    box-shadow:var(--shadow);
  }
  @media (min-width:640px){ .picker{border-radius:18px;} }
  .picker-head{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:14px;
  }
  .picker-head h3{font-size:1.25rem;}
  .picker-head .sub{font-size:0.82rem; color:var(--ink-soft);}
  .close-x{
    background:none; border:none; color:var(--ink-soft);
    font-size:1.3rem; line-height:1; cursor:pointer; padding:2px 6px;
  }
  .close-x:hover{color:var(--accent);}
  .cat-group{margin-bottom:16px;}
  .cat-group h4{
    font-size:0.7rem; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--ink-soft); margin:0 0 8px;
    display:flex; align-items:center; gap:8px;
  }
  .cat-group h4::after{content:""; flex:1; height:1px; background:var(--line);}
  .meal-option{
    width:100%;
    display:flex; align-items:center; justify-content:space-between;
    background:transparent;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:7px;
    cursor:pointer;
    text-align:left;
    color:var(--ink);
  }
  .meal-option:hover{border-color:var(--accent); background:rgba(194,74,52,0.06);}
  .meal-option .mo-name{font-weight:600; font-size:0.92rem;}
  .meal-option .mo-time{font-size:0.68rem; color:var(--ink-soft);}
  .add-own{
    display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;
  }
  .add-own input, .add-own select{
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    border-radius:8px;
    padding:9px 10px;
    font-size:0.85rem;
    font-family:inherit;
  }
  .add-own input[type="text"]{flex:1; min-width:140px;}
  .add-own button{
    background:var(--forest);
    color:var(--forest-ink);
    border:none;
    border-radius:8px;
    padding:9px 14px;
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
  }
  .clear-day{
    margin-top:10px;
    background:none; border:none;
    color:var(--ink-soft);
    font-size:0.78rem; text-decoration:underline;
    cursor:pointer;
  }

  /* name modal */
  .name-modal{
    background:var(--card);
    border-radius:16px;
    padding:26px;
    max-width:340px;
    width:100%;
    box-shadow:var(--shadow);
    text-align:left;
  }
  .name-modal h3{font-size:1.15rem; margin-bottom:6px;}
  .name-modal p{color:var(--ink-soft); font-size:0.85rem; margin-bottom:14px;}
  .name-modal input{
    width:100%;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    border-radius:8px;
    padding:10px 12px;
    font-size:0.95rem;
    margin-bottom:12px;
    font-family:inherit;
  }
  .name-modal button{
    width:100%;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    border-radius:8px;
    padding:11px;
    font-weight:600;
    cursor:pointer;
  }

  .footnote{
    margin-top:26px;
    text-align:center;
    font-size:0.75rem;
    color:var(--ink-soft);
  }
</style>

<div class="wrap" id="app"></div>

<script>
(function(){
  var PRESETS = [
    {id:'p1', name:'Garlic Butter Shrimp & Rice', category:'quick', time:'18 min'},
    {id:'p2', name:'Caprese Pasta', category:'quick', time:'15 min'},
    {id:'p3', name:'Sheet-Pan Sausage & Peppers', category:'quick', time:'20 min'},
    {id:'p4', name:'Quesadillas & Black Beans', category:'quick', time:'15 min'},
    {id:'p5', name:'Baked Ziti', category:'comfort', time:'45 min'},
    {id:'p6', name:'Chicken Pot Pie', category:'comfort', time:'55 min'},
    {id:'p7', name:'Beef Stew', category:'comfort', time:'90 min'},
    {id:'p8', name:'Meatloaf & Mashed Potatoes', category:'comfort', time:'60 min'},
    {id:'p9', name:'Grilled Salmon & Asparagus', category:'healthy', time:'25 min'},
    {id:'p10', name:'Turkey Chili', category:'healthy', time:'40 min'},
    {id:'p11', name:'Buddha Bowl with Tahini', category:'healthy', time:'20 min'},
    {id:'p12', name:'Zucchini Noodle Primavera', category:'healthy', time:'25 min'},
    {id:'p13', name:'Order Thai', category:'takeout', time:'0 min'},
    {id:'p14', name:'Order Pizza', category:'takeout', time:'0 min'},
    {id:'p15', name:'Order Sushi', category:'takeout', time:'0 min'},
    {id:'p16', name:'Steak & Roasted Potatoes', category:'date', time:'35 min'},
    {id:'p17', name:'Shrimp Scampi', category:'date', time:'25 min'},
    {id:'p18', name:'Homemade Pizza Night', category:'date', time:'40 min'},
    {id:'p19', name:'Fridge-Raid Stir-Fry', category:'leftovers', time:'15 min'},
    {id:'p20', name:'Leftover Remix Night', category:'leftovers', time:'10 min'}
  ];
  var CATS = [
    {key:'quick', label:'Quick (under 20 min)'},
    {key:'comfort', label:'Comfort food'},
    {key:'healthy', label:'Something healthy'},
    {key:'date', label:'Date-night effort'},
    {key:'takeout', label:'Off night / takeout'},
    {key:'leftovers', label:'Leftovers & fridge clean-out'}
  ];
  var DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var AVATAR_COLORS = ['#C24A34','#2F5233','#C98A1F','#5B3B8C','#1F6E5C','#A62A4C'];

  var myName = localStorage.getItem('dd_name') || '';
  var customMeals = [];
  var plan = null;
  var planLoaded = false;
  var ui = { pickerFor: null, pickerCat: null, planningNew: false };
  var db = null;
  var localMode = false;

  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function isoDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function mondayOf(d){
    var day = d.getDay(); // 0 Sun..6 Sat
    var diff = (day === 0 ? -6 : 1 - day);
    var m = new Date(d);
    m.setDate(d.getDate()+diff);
    m.setHours(0,0,0,0);
    return m;
  }
  function weekDatesFrom(mondayIso){
    var base = new Date(mondayIso+'T00:00:00');
    var out = [];
    for (var i=0;i<7;i++){
      var d = new Date(base);
      d.setDate(base.getDate()+i);
      out.push(isoDate(d));
    }
    return out;
  }
  function formatShort(iso){
    var d = new Date(iso+'T00:00:00');
    return MONTHS[d.getMonth()]+' '+d.getDate();
  }
  function hashColor(name){
    var h = 0;
    for (var i=0;i<name.length;i++){ h = name.charCodeAt(i) + ((h<<5)-h); }
    return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
  }
  function initials(name){
    return name.trim().split(/\s+/).map(function(p){return p[0];}).slice(0,2).join('').toUpperCase();
  }
  function allMeals(){ return PRESETS.concat(customMeals); }
  function catLabel(key){
    var c = CATS.filter(function(c){return c.key===key;})[0];
    return c ? c.label : key;
  }

  // ---------- storage layer: db capability, falls back to localStorage ----------
  var LOCAL_PLAN_KEY = 'dd_plan_v1';
  var LOCAL_MEALS_KEY = 'dd_custom_meals_v1';

  function localGetPlan(){
    try { return JSON.parse(localStorage.getItem(LOCAL_PLAN_KEY) || 'null'); } catch(e){ return null; }
  }
  function localSetPlan(data){
    localStorage.setItem(LOCAL_PLAN_KEY, JSON.stringify(data));
    plan = data; render();
  }
  function localUpdatePlan(partial){
    var cur = localGetPlan() || {days:{}};
    if (partial.days){
      cur.days = cur.days || {};
      for (var k in partial.days){ cur.days[k] = partial.days[k]; }
    }
    for (var key in partial){ if (key !== 'days') cur[key] = partial[key]; }
    localSetPlan(cur);
  }
  function localGetMeals(){
    try { return JSON.parse(localStorage.getItem(LOCAL_MEALS_KEY) || '[]'); } catch(e){ return []; }
  }
  function localAddMeal(meal){
    var list = localGetMeals();
    meal.id = 'c'+Date.now();
    list.push(meal);
    localStorage.setItem(LOCAL_MEALS_KEY, JSON.stringify(list));
    customMeals = list; render();
  }

  function setPlan(data){
    if (db){ db.doc('plan/current').set(data).catch(function(){}); }
    else { localSetPlan(data); }
  }
  function updatePlan(partial){
    if (db){
      db.doc('plan/current').get().then(function(snap){
        if (snap.exists){ db.doc('plan/current').update(partial).catch(function(){}); }
        else { setPlan(Object.assign({days:{}}, partial)); }
      });
    } else {
      localUpdatePlan(partial);
    }
  }
  function addMeal(meal){
    if (db){ db.collection('customMeals').add(meal).catch(function(){}); }
    else { localAddMeal(meal); }
  }

  async function initStore(){
    var namespace = null;
    try {
      if (window.claude && window.claude.use){
        namespace = await window.claude.use('db');
      }
    } catch(e){ namespace = null; }

    if (!namespace){
      localMode = true;
      plan = localGetPlan();
      customMeals = localGetMeals();
      planLoaded = true;
      render();
      return;
    }
    db = namespace;
    db.doc('plan/current').onSnapshot(function(snap){
      plan = snap.exists ? snap.data() : null;
      planLoaded = true;
      render();
    }, function(){
      localMode = true; plan = localGetPlan(); planLoaded = true; render();
    });
    db.collection('customMeals').onSnapshot(function(qs){
      customMeals = qs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(){});
  }

  // ---------- actions ----------
  function saveName(n){
    myName = n.trim();
    if (myName) localStorage.setItem('dd_name', myName);
    render();
  }
  function startWeek(){
    var monday = isoDate(mondayOf(new Date()));
    setPlan({ weekStart: monday, days: {}, startedBy: myName, startedAt: Date.now() });
    ui.planningNew = false;
    render();
  }
  function beginNewWeek(){
    ui.planningNew = true; render();
  }
  function cancelNewWeek(){
    ui.planningNew = false; render();
  }
  function openPicker(iso){ ui.pickerFor = iso; ui.pickerCat = null; render(); }
  function closePicker(){ ui.pickerFor = null; render(); }
  function pickMeal(iso, meal){
    var patch = {}; patch[iso] = {
      mealId: meal.id, name: meal.name, category: meal.category, time: meal.time || '',
      pickedBy: myName
    };
    updatePlan({ days: patch });
    ui.pickerFor = null;
    render();
  }
  function clearDay(iso){
    var patch = {}; patch[iso] = null;
    updatePlan({ days: patch });
    ui.pickerFor = null;
    render();
  }
  function submitCustomMeal(iso){
    var input = document.getElementById('own-name');
    var sel = document.getElementById('own-cat');
    var name = input.value.trim();
    if (!name) return;
    var meal = { name: name, category: sel.value, time: '', addedBy: myName, createdAt: Date.now() };
    addMeal(meal);
    pickMeal(iso, meal);
  }

  window.dd = {
    saveName: saveName, startWeek: startWeek, beginNewWeek: beginNewWeek, cancelNewWeek: cancelNewWeek,
    openPicker: openPicker, closePicker: closePicker, pickMeal: pickMeal, clearDay: clearDay,
    submitCustomMeal: submitCustomMeal
  };

  // ---------- render ----------
  function render(){
    var app = document.getElementById('app');
    if (!myName){
      app.innerHTML = header() + nameModalOverlay();
      var f = document.getElementById('name-form');
      if (f) f.addEventListener('submit', function(e){
        e.preventDefault();
        dd.saveName(document.getElementById('name-input').value);
      });
      return;
    }

    if (!planLoaded){
      app.innerHTML = header() + '<div class="hero"><p>Setting the table&hellip;</p></div>';
      return;
    }

    var todayMonday = isoDate(mondayOf(new Date()));
    var showStart = !plan || !plan.weekStart || ui.planningNew;

    var html = header();
    if (showStart){
      html += heroStart(plan && plan.weekStart);
    } else {
      html += boardView(plan, todayMonday);
      if (ui.pickerFor) html += pickerOverlay(ui.pickerFor);
    }
    html += footnote();
    app.innerHTML = html;
    attachBoardHandlers();
  }

  function header(){
    var initialsBadge = myName ? '<span class="avatar" style="background:'+hashColor(myName)+'">'+initials(myName)+'</span>' : '';
    return '' +
    '<div class="topbar">' +
      '<div class="brand"><h1>Dinner Docket</h1><span class="tag mono">this week&rsquo;s lineup</span></div>' +
      (myName ? '<div class="who">'+initialsBadge+'<span>Signed in as '+escapeHtml(myName)+'</span>' +
        (plan && plan.weekStart ? '<button onclick="dd.beginNewWeek()">Start a new week</button>' : '') +
      '</div>' : '') +
    '</div>';
  }

  function nameModalOverlay(){
    return '<div class="overlay"><div class="name-modal">' +
      '<h3>Pull up a chair</h3>' +
      '<p>What should we call you on the docket? This just labels who picked what.</p>' +
      '<form id="name-form">' +
        '<input id="name-input" type="text" placeholder="Your name" autofocus required>' +
        '<button type="submit">That&rsquo;s me</button>' +
      '</form>' +
    '</div></div>';
  }

  function heroStart(hadPlanBefore){
    return '<div class="hero">' +
      '<span class="eyebrow mono">' + (hadPlanBefore ? 're-up for the week' : 'new here') + '</span>' +
      '<h2>' + (hadPlanBefore ? 'Ready to plan next week&rsquo;s dinners?' : 'What&rsquo;s on the docket this week?') + '</h2>' +
      '<p>Seven nights, seven decisions. Pick something for each night &mdash; quick fixes, comfort food, or an off night. Whatever you choose shows up for both of you.</p>' +
      '<button class="primary-btn" onclick="dd.startWeek()">Let&rsquo;s plan it</button>' +
      (hadPlanBefore ? '<button class="ghost-btn" style="margin-top:6px;" onclick="dd.cancelNewWeek()">Never mind, keep this week</button>' : '') +
    '</div>';
  }

  function boardView(plan, todayMonday){
    var dates = weekDatesFrom(plan.weekStart);
    var todayIso = isoDate(new Date());
    var rangeLabel = formatShort(dates[0]) + ' – ' + formatShort(dates[6]);
    var html = '<div class="board-head"><h2>This week&rsquo;s docket</h2><span class="range mono">'+rangeLabel+'</span></div>';
    html += '<div class="board">';
    dates.forEach(function(iso, i){
      var entry = plan.days ? plan.days[iso] : null;
      var isToday = iso === todayIso;
      html += '<div class="day'+(isToday?' today':'')+'">';
      html += '<div class="day-label"><span class="day-name">'+DAY_NAMES[i]+'</span><span class="day-date mono">'+formatShort(iso)+'</span></div>';
      if (entry && entry.name){
        html += '<div class="slot-filled">' +
          '<div><div class="meal-name">'+escapeHtml(entry.name)+'</div>' +
          '<div class="meal-meta">' +
            '<span class="chip cat-'+entry.category+'">'+entry.category+'</span>' +
            (entry.time ? '<span class="time-badge mono">'+escapeHtml(entry.time)+'</span>' : '') +
          '</div></div>' +
          '<div class="meal-foot">' +
            (entry.pickedBy ? '<span class="picked-by"><span class="avatar" style="width:16px;height:16px;font-size:0.55rem;background:'+hashColor(entry.pickedBy)+'">'+initials(entry.pickedBy)+'</span>'+escapeHtml(entry.pickedBy)+'</span>' : '<span></span>') +
            '<button class="swap-btn" data-open="'+iso+'">swap</button>' +
          '</div>' +
        '</div>';
      } else {
        html += '<button class="slot-empty" data-open="'+iso+'">+ pick a meal</button>';
      }
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function pickerOverlay(iso){
    var d = new Date(iso+'T00:00:00');
    var dayName = DAY_NAMES[(d.getDay()+6)%7];
    var groups = CATS.map(function(cat){
      var options = allMeals().filter(function(m){ return m.category === cat.key; });
      if (!options.length) return '';
      var rows = options.map(function(m){
        return '<button class="meal-option" data-pick="'+m.id+'"><span class="mo-name">'+escapeHtml(m.name)+'</span>' +
          (m.time ? '<span class="mo-time mono">'+escapeHtml(m.time)+'</span>' : '') + '</button>';
      }).join('');
      return '<div class="cat-group"><h4>'+cat.label+'</h4>'+rows+'</div>';
    }).join('');

    var catOptions = CATS.map(function(c){ return '<option value="'+c.key+'">'+c.label+'</option>'; }).join('');

    return '<div class="overlay" id="picker-overlay">' +
      '<div class="picker">' +
        '<div class="picker-head"><div><h3>'+dayName+', '+formatShort(iso)+'</h3><div class="sub">What sounds good?</div></div>' +
          '<button class="close-x" onclick="dd.closePicker()">&times;</button></div>' +
        groups +
        '<div class="cat-group"><h4>Add your own</h4>' +
          '<div class="add-own">' +
            '<input type="text" id="own-name" placeholder="Name a dish">' +
            '<select id="own-cat">'+catOptions+'</select>' +
            '<button type="button" onclick="dd.submitCustomMeal(\''+iso+'\')">Add & pick</button>' +
          '</div>' +
        '</div>' +
        '<button class="clear-day" onclick="dd.clearDay(\''+iso+'\')">Clear this night</button>' +
      '</div>' +
    '</div>';
  }

  function footnote(){
    return '<div class="footnote">' + (localMode
      ? 'Saved on this device. Open this same link on both phones to keep in sync.'
      : 'Updates live for both of you.') + '</div>';
  }

  function attachBoardHandlers(){
    document.querySelectorAll('[data-open]').forEach(function(el){
      el.addEventListener('click', function(){ dd.openPicker(el.getAttribute('data-open')); });
    });
    document.querySelectorAll('[data-pick]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-pick');
        var meal = allMeals().filter(function(m){ return m.id === id; })[0];
        if (meal) dd.pickMeal(ui.pickerFor, meal);
      });
    });
    var overlay = document.getElementById('picker-overlay');
    if (overlay){
      overlay.addEventListener('click', function(e){
        if (e.target === overlay) dd.closePicker();
      });
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  render();
  initStore();
})();
</script>
